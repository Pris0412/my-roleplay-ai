<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>墨间 · Inkroom</title>
<meta name="description" content="沉浸式小说风 AI 角色扮演前端">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&family=Noto+Sans+SC:wght@400;500;700&family=ZCOOL+XiaoWei&display=swap">
<style>
:root{
  --bg:#F3F4F7; --surface:#FFFFFF; --surface2:#EBEDF2; --ink:#1F222B; --ink2:#4A4F5C; --muted:#7C8190;
  --line:#DFE2E9; --accent:#8A3B64; --accent-ink:#FFFFFF; --accent-soft:#F3E4EC; --gold:#A8802F; --gold-soft:#F4ECD9;
  --ok:#2F7D5B; --warn:#B7791F; --bad:#B23A48; --shadow:0 12px 32px rgba(30,34,43,.14);
  --display:'ZCOOL XiaoWei','Noto Serif SC',serif; --serif:'Noto Serif SC','Songti SC','SimSun',serif; --sans:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
  --reader-size:19px; --reader-font:var(--serif);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14161B; --surface:#1B1E25; --surface2:#23272F; --ink:#E9E5DC; --ink2:#C3BFB5; --muted:#8E929E;
    --line:#2C3038; --accent:#D98AB1; --accent-ink:#1B1E25; --accent-soft:#2E2229; --gold:#D3AB5C; --gold-soft:#2C271B;
    --ok:#5FB58F; --warn:#D9A24A; --bad:#E06A78; --shadow:0 12px 32px rgba(0,0,0,.45); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14161B; --surface:#1B1E25; --surface2:#23272F; --ink:#E9E5DC; --ink2:#C3BFB5; --muted:#8E929E;
  --line:#2C3038; --accent:#D98AB1; --accent-ink:#1B1E25; --accent-soft:#2E2229; --gold:#D3AB5C; --gold-soft:#2C271B;
  --ok:#5FB58F; --warn:#D9A24A; --bad:#E06A78; --shadow:0 12px 32px rgba(0,0,0,.45); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
textarea,input[type=text],input[type=number],select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink)}
textarea{resize:vertical;min-height:80px;line-height:1.6}
label.f{display:block;font-size:13px;color:var(--muted);letter-spacing:.04em;margin:12px 0 4px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
.hidden{display:none!important}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px;border:2px solid var(--bg)}

/* ===== shell ===== */
#app{display:grid;grid-template-columns:64px auto 1fr;height:100vh;height:100dvh}
#rail{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:4px}
#rail .logo{font-family:var(--display);font-size:22px;color:var(--accent);margin-bottom:10px;line-height:1}
.rb{width:48px;height:48px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:11px;position:relative}
.rb svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rb.on{background:var(--accent-soft);color:var(--accent)}
.rb:hover{color:var(--accent)}
#rail .spacer{flex:1}
#panel{width:340px;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;min-height:0}
#panel.closed{width:0;border:0;overflow:hidden}
.ph{padding:18px 18px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.ph h2{font-size:22px}
.pb{flex:1;overflow:auto;padding:0 18px 24px}
.card{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.card.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;background:var(--surface2);color:var(--ink);font-size:14px;line-height:1.2;white-space:nowrap}
.btn:hover{filter:brightness(.96)}
.btn.p{background:var(--accent);color:var(--accent-ink)}
.btn.g{background:var(--gold);color:#fff}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.chip{display:inline-flex;align-items:center;padding:3px 9px;border-radius:999px;background:var(--surface2);font-size:12px;color:var(--ink2);gap:4px}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip.gold{background:var(--gold-soft);color:var(--gold)}
.muted{color:var(--muted);font-size:13px}
.tiny{font-size:12px;color:var(--muted)}
.sep{height:1px;background:var(--line);margin:14px 0}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 12px;overflow-x:auto}
.tab{padding:10px 12px;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab.on{color:var(--accent);border-color:var(--accent)}
details.acc{border:1px solid var(--line);border-radius:12px;padding:0 12px;margin-bottom:8px;background:var(--bg)}
details.acc summary{cursor:pointer;padding:10px 0;font-size:14px;list-style:none;display:flex;align-items:center;gap:8px}
details.acc summary::before{content:"▸";color:var(--muted);transition:transform .15s}
details.acc[open] summary::before{transform:rotate(90deg)}
details.acc .body{padding:0 0 12px}

/* ===== main ===== */
#main{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
#topbar{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--surface)}
#topbar h1{font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topbar .who{display:flex;gap:6px;flex-wrap:wrap}
.ava{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-family:var(--display)}
#ctx{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-size:12px;color:var(--muted);min-width:150px}
#ctx .bar{width:150px;height:6px;border-radius:6px;background:var(--surface2);overflow:hidden}
#ctx .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
#ctx.warn .bar i{background:var(--warn)}#ctx.bad .bar i{background:var(--bad)}
#bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:var(--bg-opacity,.35);pointer-events:none;display:none}
#main.hasbg #bg{display:block}
#reader{flex:1;overflow:auto;padding:28px 20px 40px;scroll-behavior:smooth;position:relative}
#main.hasbg #reader .col{background:color-mix(in srgb,var(--surface) 84%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:18px;padding:22px 26px}
@media (prefers-reduced-motion:reduce){#reader{scroll-behavior:auto}}
#reader .col{max-width:44em;margin:0 auto;font-family:var(--reader-font);font-size:var(--reader-size);line-height:1.95}
.floor{position:relative;padding:14px 0 14px 14px;margin:0 0 8px;border-left:2px solid transparent}
.floor:hover{border-left-color:var(--line)}
.floor.user{border-left-color:var(--accent-soft)}
.floor.hid{opacity:.45}
.floor.hid .txt{max-height:6.5em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 40%,transparent);mask-image:linear-gradient(#000 40%,transparent)}
.floor .lbl{font-family:var(--sans);font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;margin-bottom:6px;letter-spacing:.06em}
.floor .lbl b{font-family:var(--display);font-weight:400;font-size:15px;color:var(--accent);letter-spacing:0}
.floor .lbl img,.ava img{width:28px;height:28px;border-radius:50%;object-fit:cover;display:block}
.ava{overflow:hidden}
.ava.big{width:72px;height:72px;font-size:28px}.ava.big img{width:72px;height:72px}
.floor.user .lbl b{color:var(--gold)}
.floor .txt p{margin:0 0 .9em}
.floor .txt em{color:var(--ink2)}
.floor .txt.stream::after{content:"▍";color:var(--accent);animation:blink 1s infinite}
@keyframes blink{50%{opacity:0}}
.floor .acts{position:absolute;right:0;top:8px;display:none;gap:2px;font-family:var(--sans);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:2px;box-shadow:var(--shadow)}
.floor:hover .acts,.floor.menu .acts{display:flex}
.floor .acts button{padding:6px 8px;border-radius:8px;font-size:12px;color:var(--ink2)}
.floor .acts button:hover{background:var(--surface2);color:var(--accent)}
.floor .swp{font-family:var(--sans);font-size:12px;color:var(--muted);display:inline-flex;gap:6px;align-items:center;margin-top:4px}
.floor .swp button{padding:2px 8px;border-radius:6px;background:var(--surface2)}
.floor .ed{width:100%;font-family:inherit;font-size:inherit;line-height:inherit;min-height:160px}
.floor .note{font-family:var(--sans);font-size:12px;color:var(--gold);margin-top:4px}
.empty{text-align:center;color:var(--muted);font-family:var(--sans);font-size:15px;padding:40px 20px}
.mascot{position:relative;width:150px;height:130px;margin:0 auto 14px}
.mascot .blob{position:absolute;left:35px;top:14px;width:80px;height:80px;background:var(--accent);border-radius:46% 54% 50% 50%/60% 60% 40% 40%;animation:bob 3.2s ease-in-out infinite;box-shadow:inset -10px -8px 0 rgba(0,0,0,.08)}
.mascot .eye{position:absolute;top:34px;width:10px;height:14px;background:#fff;border-radius:50%;animation:wink 4.5s infinite}
.mascot .eye::after{content:"";position:absolute;left:3px;top:3px;width:4px;height:5px;background:var(--accent);border-radius:50%}
.mascot .cheek{position:absolute;top:52px;width:12px;height:6px;background:rgba(255,255,255,.4);border-radius:50%}
.mascot .shadow{position:absolute;left:50px;bottom:10px;width:50px;height:10px;background:var(--line);border-radius:50%;animation:shade 3.2s ease-in-out infinite}
.mascot .sp{position:absolute;width:6px;height:6px;background:var(--gold);border-radius:50%;animation:spark 2.6s infinite}
.mascot .bubble{position:absolute;left:118px;top:0;background:var(--surface);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:6px 10px;font-size:13px;white-space:nowrap;color:var(--ink2);animation:fadein .8s .3s both}
@keyframes bob{50%{transform:translateY(-8px) rotate(-3deg)}}
@keyframes wink{0%,90%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes shade{50%{transform:scaleX(.78);opacity:.55}}
@keyframes spark{0%{opacity:0;transform:translateY(0) scale(.4)}40%{opacity:1}100%{opacity:0;transform:translateY(-28px) scale(1)}}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}}
@media (prefers-reduced-motion:reduce){.mascot *{animation:none!important}}
.empty h3{font-size:28px;margin-bottom:8px;color:var(--ink)}

/* ===== composer ===== */
#composer{border-top:1px solid var(--line);background:var(--surface);padding:10px 16px 14px}
#composer .inner{max-width:46em;margin:0 auto}
#quick{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;-ms-overflow-style:none;scrollbar-width:none}
#quick::-webkit-scrollbar{display:none}
#quick button{flex:none;padding:4px 10px;border-radius:8px;background:var(--surface2);font-size:14px;font-family:var(--serif)}
#quick button:hover{background:var(--accent-soft);color:var(--accent)}
#msg{min-height:64px;max-height:40vh;font-family:var(--serif);font-size:17px;border-radius:14px;padding:12px 14px}
#cbar{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
#cbar .ib{width:38px;height:38px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;background:var(--surface2);color:var(--ink2);font-size:18px}
#cbar .ib:hover{color:var(--accent)}
#cbar .ib.on{background:var(--accent-soft);color:var(--accent)}
#cbar select{width:auto;padding:7px 10px;border-radius:10px;font-size:13px;background:var(--surface2);border:0}
#send{margin-left:auto;padding:9px 20px;border-radius:12px;font-size:15px}
#stop{padding:9px 14px;border-radius:12px;color:var(--bad);background:var(--surface2)}
#status{font-size:12px;color:var(--muted);margin-top:6px;min-height:16px}

/* ===== drawer ===== */
#drawer{position:absolute;top:0;right:0;bottom:0;width:420px;max-width:100%;background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);transform:translateX(105%);transition:transform .2s;display:flex;flex-direction:column;z-index:20}
#drawer.open{transform:none}
@media (prefers-reduced-motion:reduce){#drawer{transition:none}}
#drawer .pb{padding:14px 18px 30px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.rel{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:var(--bg);cursor:pointer}
.rel .h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rel .h b{font-weight:500}
.rel .hist{margin-top:8px;font-size:13px;color:var(--ink2);border-top:1px dashed var(--line);padding-top:8px}
.rel .hist div{margin-bottom:4px}
svg.graph{width:100%;height:auto;display:block;background:var(--bg);border:1px solid var(--line);border-radius:14px}
svg.graph text{font-family:var(--sans);fill:var(--ink)}
svg.graph .n circle{fill:var(--surface);stroke:var(--accent);stroke-width:2}
svg.graph .e line{stroke:var(--accent);stroke-opacity:.5;stroke-width:2}
svg.graph .e text{font-size:11px;fill:var(--muted)}
pre.pv{white-space:pre-wrap;word-break:break-word;font-family:var(--sans);font-size:13px;line-height:1.6;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;max-height:60vh;overflow:auto}
.memhit{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:var(--bg);font-size:14px}
.memhit .h{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-bottom:4px}
.memhit .t{font-family:var(--serif);color:var(--ink2);max-height:5.2em;overflow:hidden}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:99;box-shadow:var(--shadow);max-width:90vw}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border-radius:18px;padding:22px;width:min(640px,100%);max-height:90vh;overflow:auto;box-shadow:var(--shadow)}
.modal h3{font-size:22px;margin-bottom:8px}
.swatch{display:inline-block;width:14px;height:14px;border-radius:50%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.lore{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:var(--bg)}
.lore .h{display:flex;align-items:center;gap:8px}
.lore .h b{font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lore .keys{font-size:12px;color:var(--muted);margin-top:2px}
.lore.off{opacity:.55}
.sw{width:34px;height:20px;border-radius:20px;background:var(--line);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--surface);transition:left .15s}
.sw.on{background:var(--accent)}.sw.on::after{left:17px}
#mobileTabs{display:none}
/* ===== phone ===== */
#drawerBody.phone{display:flex;flex-direction:column;overflow:hidden;padding:0}
.wa{display:flex;flex-direction:column;height:100%;min-height:0;font-family:var(--sans)}
.wa .bar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface)}
.wa .bar b{font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wa .list{flex:1;overflow:auto;padding:8px 10px}
.wa .item{display:flex;align-items:center;gap:10px;padding:10px 8px;border-radius:12px;cursor:pointer}
.wa .item:hover{background:var(--surface2)}
.wa .item .t{flex:1;min-width:0}.wa .item .t b{font-weight:500;display:block}.wa .item .t span{font-size:12px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wa .badge{min-width:20px;height:20px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-size:12px;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
.wa .msgs{flex:1;overflow:auto;padding:12px 12px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.wa .day{align-self:center;font-size:11px;color:var(--muted);background:var(--surface2);padding:2px 10px;border-radius:10px;margin:6px 0}
.bub{max-width:82%;padding:8px 12px;border-radius:16px;font-size:15px;line-height:1.5;word-break:break-word;position:relative}
.bub.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.bub.them{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.bub .who{font-size:11px;color:var(--accent);margin-bottom:2px}
.bub .tm{font-size:10px;opacity:.6;margin-top:2px;text-align:right}
.bub.tx{background:var(--gold-soft);border:1px dashed var(--gold);color:var(--ink);min-width:160px}
.bub.tx .amt{font-size:22px;font-family:var(--display);color:var(--gold)}
.bub.typing{color:var(--muted);font-style:italic}
.wa .in{display:flex;gap:6px;padding:8px 10px max(8px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--surface);align-items:flex-end}
.wa .in textarea{min-height:40px;max-height:120px;border-radius:20px;padding:9px 14px;font-size:15px}
.wa .wallet{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--gold-soft);color:var(--ink);border-radius:14px;margin:10px}
.wa .wallet b{font-family:var(--display);font-size:22px;color:var(--gold)}
.fx{width:100%;border:0;display:block;border-radius:12px;background:transparent;min-height:40px}
.fx-wrap{margin:.6em 0}
.rx{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:var(--bg)}
.rx .h{display:flex;align-items:center;gap:8px}.rx .h b{font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rx code{font-size:12px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
#saveInd{font-size:11px;color:var(--muted);white-space:nowrap}
#saveInd.busy{color:var(--warn)}#saveInd.err{color:var(--bad)}
#plusBtn .dot{position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;background:var(--bad)}
#cbar .ib{position:relative}

@media (max-width:900px){
  #app{grid-template-columns:1fr;grid-template-rows:1fr auto}
  #rail{display:none}
  #mobileTabs{display:flex;background:var(--surface);border-top:1px solid var(--line);justify-content:space-around;padding:4px 0 max(4px,env(safe-area-inset-bottom))}
  #mobileTabs .rb{width:auto;padding:4px 10px;height:46px}
  #panel{position:absolute;inset:0 0 56px 0;width:100%;z-index:15;border:0}
  #panel.closed{display:none}
  #topbar{padding:10px 14px}#topbar h1{font-size:18px}#ctx{min-width:90px}#ctx .bar{width:90px}
  #reader{padding:18px 14px 30px}
  .floor{padding-left:10px}
  .floor .acts{display:flex;position:static;box-shadow:none;border:0;background:transparent;margin-top:6px;flex-wrap:wrap}
  #drawer{width:100%}
  #send{padding:9px 14px}
}
</style>
</head>
<body>

<div id="app">
  <nav id="rail"></nav>
  <aside id="panel" class="closed"><div class="ph"><h2 id="panelTitle"></h2><button class="btn sm ghost" id="panelClose">收起</button></div><div class="pb" id="panelBody"></div></aside>
  <section id="main">
    <header id="topbar">
      <h1 id="worldTitle">—</h1>
      <div class="who" id="who"></div>

<script>

const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];

/* ---------------- defaults & seed ---------------- */
const REPLY_MODES=[
 {id:'none',label:'不抢话·不描 uu',text:'绝对不要替 {{user}} 说话、做决定，也不要描写 {{user}} 的动作与表情；只写其他角色与环境。'},
 {id:'expr',label:'不抢话·描 uu 表情动作',text:'不要替 {{user}} 说出新的台词或做新的决定，但可以在他人视角下描写 {{user}} 已发生的动作、表情与神态。'},
 {id:'echo',label:'复述 uu 的话',text:'可以在叙述中自然地复述、引用 {{user}} 刚才说过的话，但不要替 {{user}} 添加新的台词或决定。'},
 {id:'echox',label:'复述+扩展',text:'可以复述 {{user}} 的话，并在不改变其意图的前提下补充相应的动作、表情与小动作，让场景更完整；仍不要替 {{user}} 做出重大新决定。'},
];
const LENGTHS=[{id:300,label:'短 · 约300字'},{id:800,label:'中 · 约800字'},{id:1500,label:'长 · 约1500字'},{id:2500,label:'超长 · 2500字+'}];
const TIERS=[{id:'quick',label:'快速档（最快·不思考）'},{id:'default',label:'标准档（日常均衡）'},{id:'complex',label:'深思档（最强·思考最久）'}];

const DEFAULT_SUMMARY_PROMPT=`你是这段角色扮演剧情的记录员。请把下面这些楼层的内容压缩成一段条理清晰的剧情总结，供后续对话作为长期记忆使用。要求：
1. 保留关键事件、时间地点、人物关系变化、承诺/约定、重要物品与伏笔；
2. 保留角色之间说过的、以后可能被提起的重要台词（可简化）；
3. 用第三人称、过去式，600 字以内；
4. 不要评价，不要加入未发生的内容。`;
const DEFAULT_PRESET=`你是一位文笔细腻的小说作者，正在与用户共同创作一部沉浸式的长篇小说。
写作原则：
- 以第三人称、过去式叙述（除非用户另有要求），像正统小说一样：有环境描写、心理活动、肢体细节、对白节奏；
- 角色必须严格遵守人设，说话方式、口癖、性格逻辑要前后一致；
- 允许世界继续运转：在场的 NPC 可以主动出场、插话、推动事件；不在场的角色可以通过消息、传闻、回忆出现；
- 不要总结、不要给出选项、不要跳出剧情解释；直接写正文；
- 避免重复用户已经写过的段落，接着往下推进；
- 尺度与氛围跟随用户的引导，保持文学性。`;
const DEFAULT_QUICK=['「」','『』','……','——','（）','【】','♪','~','*','—'];

function emptyWorld(presetId,name){return {id:'w_'+uid(),name:name||'新的世界',presetId,charIds:[],user:{name:'uu',desc:''},lorebook:[],floors:[],branches:[],summaries:[],state:{date:'',time:'',place:'',weather:'',inner:'',present:''},relations:[],notes:[]}}
function seedState(){
  const w=emptyWorld('p_default');
  return {version:2, updatedAt:now(),
    settings:{fontSize:19,font:'serif',tier:'default',model:'claude-opus-5',backendUrl:'',length:800,replyMode:'expr',quick:DEFAULT_QUICK.slice(),summaryPrompt:DEFAULT_SUMMARY_PROMPT,keepRecent:4,autoSumEvery:20,ftsK:15,warnKB:44,theme:'auto',pov:'third',bgOpacity:.35},
    assets:{}, regex:[],
    presets:[{id:'p_default',name:'默认 · 小说叙事',text:DEFAULT_PRESET}],
    characters:[], activeWorldId:w.id, worlds:[w]
  };
}
/* 旧版本升级：删掉没玩过的示例世界与示例角色，去掉「主角/NPC」类型 */
function migrate(s){
  const seedIds=['c_shen','c_lin','c_jiang','c_ze'];
  const demo=(s.worlds||[]).find(w=>w.id==='w_demo');
  if(demo&&!demo.floors.some(f=>f.role==='user')){s.worlds=s.worlds.filter(w=>w!==demo);dirty.add('w_demo')}
  s.characters=(s.characters||[]).filter(c=>!(seedIds.includes(c.id)&&!s.worlds.some(w=>w.charIds.includes(c.id))));
  s.characters.forEach(c=>{delete c.role});
  s.regex=s.regex||[];s.assets=s.assets||{};s.presets=s.presets&&s.presets.length?s.presets:[{id:'p_default',name:'默认 · 小说叙事',text:DEFAULT_PRESET}];
  if(!s.worlds.length){const w=emptyWorld(s.presets[0].id);s.worlds.push(w);dirty.add(w.id)}
  if(!s.worlds.some(w=>w.id===s.activeWorldId))s.activeWorldId=s.worlds[0].id;
  const def=seedState().settings;for(const k in def)if(s.settings[k]===undefined)s.settings[k]=def[k];
  return s;
}
/* 世界书里的「人物」条目：ST 风格的 NPC，也是小手机的联系人 */
function persons(w=world()){return (w.lorebook||[]).filter(e=>e.person&&e.enabled!==false&&(!e.charId||w.charIds.includes(e.charId))).map(e=>({id:'lore:'+e.id,name:e.title,color:'#5B6B8C',personality:String(e.content||'').slice(0,80),block:`■ ${e.title}（世界书人物）\n${fillVars(e.content,w)}`}))}
function personOf(id,w=world()){if(id==='user')return {id:'user',name:w.user.name};return S.characters.find(c=>c.id===id)||persons(w).find(p=>p.id===id)||null}
function contacts(w=world()){return [...chars(w),...persons(w)]}

/* ---------------- persistence ---------------- */
let S=null, DB=null, SAMPLE=null, DOWNLOADS=null, BACKEND=null, LAST_MODEL='';
const MODELS=[['claude-opus-5','Opus 5'],['claude-sonnet-5','Sonnet 5'],['claude-haiku-4-5','Haiku 4.5'],['claude-opus-4-8','Opus 4.8'],['claude-opus-4-7','Opus 4.7'],['claude-opus-4-6','Opus 4.6'],['claude-sonnet-4-6','Sonnet 4.6']];
let saveT=null, dirty=new Set();
function ls(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||'null');localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
/* IndexedDB：主本地存储（不受 5MB 限制，图片也放得下）+ 存档快照 */
const IDB={db:null,
  open(){return new Promise((res,rej)=>{try{const r=indexedDB.open('inkroom',1);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv');if(!d.objectStoreNames.contains('snap'))d.createObjectStore('snap',{keyPath:'t'})};r.onsuccess=()=>{this.db=r.result;res(this.db)};r.onerror=()=>rej(r.error)}catch(e){rej(e)}})},
  tx(store,mode,fn){return new Promise((res,rej)=>{if(!this.db)return rej(new Error('no idb'));const t=this.db.transaction(store,mode);const q=fn(t.objectStore(store));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)})},
  get(store,key){return this.tx(store,'readonly',s=>s.get(key))},
  set(store,key,val){return this.tx(store,'readwrite',s=>key===undefined?s.put(val):s.put(val,key))},
  del(store,key){return this.tx(store,'readwrite',s=>s.delete(key))},
  all(store){return this.tx(store,'readonly',s=>s.getAll())},
};
function clean(o){return JSON.parse(JSON.stringify(o,(k,v)=>k.startsWith('_')?undefined:v))}
function setSaveInd(t,cls){const el=$('#saveInd');if(el){el.textContent=t;el.className=cls||''}}
async function saveLocal(){const data=clean(S);setSaveInd('保存中…','busy');let ok=false;if(IDB.db){try{await IDB.set('kv','state',data);ok=true}catch(e){console.warn('idb',e)}}if(!ok)ls('inkroom.state',data);else{try{localStorage.removeItem('inkroom.state')}catch(e){}}setSaveInd((ok?'本地已保存 ':'已保存 ')+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}))}
async function loadLocal(){if(IDB.db){try{const d=await IDB.get('kv','state');if(d)return d}catch(e){}}return ls('inkroom.state')}
async function snapshot(reason){if(!IDB.db)return;try{await IDB.set('snap',undefined,{t:now(),reason,worldId:S.activeWorldId,floors:world().floors.length,state:clean(S)});const all=await IDB.all('snap');if(all.length>30){all.sort((a,b)=>a.t-b.t);for(const s of all.slice(0,all.length-30))await IDB.del('snap',s.t)}}catch(e){console.warn('snap',e)}}
function world(){return S.worlds.find(w=>w.id===S.activeWorldId)||S.worlds[0]}
function chars(w=world()){return w.charIds.map(id=>S.characters.find(c=>c.id===id)).filter(Boolean)}
function preset(w=world()){return S.presets.find(p=>p.id===w.presetId)||S.presets[0]}
function markDirty(what='meta'){dirty.add(what);S.updatedAt=now();clearTimeout(saveT);saveT=setTimeout(flush,600)}
function metaOf(s){const {worlds,assets,...m}=s;return m}
function assetUrl(id){return id&&S.assets&&S.assets[id]||''}
function splitWorld(w){const {floors,...rest}=w;const chunks=[];for(let i=0;i<floors.length;i+=20)chunks.push(floors.slice(i,i+20));return {rest,chunks}}
async function flush(){
  await saveLocal();
  if(!DB)return;
  try{
    const ws=[...dirty];dirty.clear();
    for(const d of ws){
      if(d==='meta'){await DB.doc('inkroom/meta').set({...metaOf(S),worldIds:S.worlds.map(w=>w.id),assetIds:Object.keys(S.assets||{})})}
      else if(d.startsWith('asset:')){const id=d.slice(6);if(S.assets[id])await DB.doc('assets/'+id).set({data:S.assets[id]});else await DB.doc('assets/'+id).delete().catch(()=>{})}
      else{const w=S.worlds.find(x=>x.id===d);if(!w){await DB.doc('worlds/'+d).delete();continue}
        const {rest,chunks}=splitWorld(w);await DB.doc('worlds/'+d).set({...rest,chunkCount:chunks.length,updatedAt:S.updatedAt});
        for(let i=0;i<chunks.length;i++)await DB.doc('worlds/'+d+'/floors/c'+i).set({floors:chunks[i]});
        for(let i=chunks.length;i<(w._chunkCount||0);i++)await DB.doc('worlds/'+d+'/floors/c'+i).delete().catch(()=>{});
        w._chunkCount=chunks.length;}
    }
    setSaveInd('云端已同步 '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}));
  }catch(e){console.warn(e);setSaveInd('云端同步失败（本地已保存）','err')}
}
async function loadFromDb(){
  const m=await DB.doc('inkroom/meta').get(); if(!m.exists)return null;
  const meta=m.data(); const worlds=[];
  for(const id of meta.worldIds||[]){
    const wd=await DB.doc('worlds/'+id).get(); if(!wd.exists)continue; const w={...wd.data()}; const floors=[];
    for(let i=0;i<(w.chunkCount||0);i++){const c=await DB.doc('worlds/'+id+'/floors/c'+i).get();if(c.exists)floors.push(...(c.data().floors||[]))}
    w.floors=floors;w._chunkCount=w.chunkCount;delete w.chunkCount;delete w.worldIds;worlds.push(w);
  }
  const assets={};for(const id of meta.assetIds||[]){const a=await DB.doc('assets/'+id).get();if(a.exists)assets[id]=a.data().data}
  const {worldIds,assetIds,...rest}=meta;
  // 平台交付的快照是冻结对象，必须深拷贝成可变数据，否则 push/赋值会报 object is not extensible
  const out=clean({...rest,worlds,assets});out.worlds.forEach(w=>{w._chunkCount=(worlds.find(x=>x.id===w.id)||{})._chunkCount});return out;
}
function saveAll(){dirty.add('meta');S.worlds.forEach(w=>dirty.add(w.id));Object.keys(S.assets||{}).forEach(id=>dirty.add('asset:'+id));markDirty('meta')}
function setAsset(id,dataUrl){S.assets=S.assets||{};if(dataUrl)S.assets[id]=dataUrl;else delete S.assets[id];markDirty('asset:'+id)}
function shrinkImage(file,maxSide,q){return new Promise((res,rej)=>{const img=new Image();const u=URL.createObjectURL(file);img.onload=()=>{const r=Math.min(1,maxSide/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',q))};img.onerror=rej;img.src=u})}

/* ---------------- FTS (在浏览器里的 FTS5 式全文索引：CJK 二元切分 + BM25) ---------------- */
const FTS={idx:new Map(),len:new Map(),N:0,avg:1,
  tok(s){const out=[];const re=/[一-鿿㐀-䶿]+|[a-z0-9]+/gi;let m;while((m=re.exec(String(s).toLowerCase()))){const t=m[0];if(/[一-鿿㐀-䶿]/.test(t)){if(t.length===1)out.push(t);for(let i=0;i<t.length-1;i++)out.push(t.slice(i,i+2))}else out.push(t)}return out},
  build(floors){this.idx.clear();this.len.clear();this.N=0;let tot=0;for(const f of floors){const toks=this.tok(f.swipes[f.si]||'');this.len.set(f.id,toks.length);tot+=toks.length;this.N++;const tf=new Map();toks.forEach(t=>tf.set(t,(tf.get(t)||0)+1));tf.forEach((c,t)=>{if(!this.idx.has(t))this.idx.set(t,new Map());this.idx.get(t).set(f.id,c)})}this.avg=tot/Math.max(1,this.N)},
  search(q,cands,k=10){const qt=[...new Set(this.tok(q))];const sc=new Map();for(const t of qt){const post=this.idx.get(t);if(!post)continue;const idf=Math.log(1+(this.N-post.size+.5)/(post.size+.5));post.forEach((tf,id)=>{if(!cands.has(id))return;const L=this.len.get(id)||1;const s=idf*(tf*2.2)/(tf+1.2*(1-.75+.75*L/this.avg));sc.set(id,(sc.get(id)||0)+s)})}return [...sc.entries()].sort((a,b)=>b[1]-a[1]).slice(0,k)}
};

/* ---------------- regex scripts (兼容 SillyTavern Regex 扩展) ---------------- */
function activeRegex(w=world()){return (S.regex||[]).filter(r=>r.enabled!==false&&(!r.charId||w.charIds.includes(r.charId)))}
function applyRegex(text,scope,stage,w=world()){
  for(const r of activeRegex(w)){
    if(r.scope&&r.scope!=='both'&&r.scope!==scope)continue;
    if(stage==='display'&&r.display===false)continue;
    if(stage==='prompt'&&!r.prompt)continue;
    try{const re=new RegExp(r.find,r.flags||'g');const rep=String(r.replace||'').replace(/\{\{match\}\}/g,'$&');text=text.replace(re,rep)}catch(e){}
  }
  return text;
}
function parseStRegex(s){const m=String(s||'').match(/^\/([\s\S]*)\/([a-z]*)$/);return m?{find:m[1],flags:m[2]||'g'}:{find:String(s||''),flags:'g'}}
function importStRegexScript(sc,charId){const {find,flags}=parseStRegex(sc.findRegex);const pl=sc.placement||[1,2];return {id:uid(),name:sc.scriptName||'脚本',find,flags,replace:sc.replaceString||'',scope:pl.includes(1)&&pl.includes(2)?'both':pl.includes(2)?'ai':'user',display:!sc.promptOnly,prompt:!sc.markdownOnly,enabled:!sc.disabled,charId:charId||''}}

/* ---------------- prompt assembly ---------------- */
function fillVars(t,w=world()){const cs=chars(w);return String(t||'').replace(/\{\{user\}\}/g,w.user.name).replace(/\{\{char\}\}/g,cs[0]?.name||'char')}
function charBlock(c,w){if(c.block)return c.block;return `■ ${c.name}
性别/年龄：${c.gender||'—'} / ${c.age||'—'}
外貌：${c.appearance||'—'}
性格：${c.personality||'—'}
背景：${c.background||'—'}
说话方式：${c.speech||'—'}
关系：${c.relation||'—'}${c.scenario?`\n场景：${fillVars(c.scenario,w)}`:''}${c.mesExample?`\n对话示例（仅供学习语气，不要照抄）：\n${fillVars(c.mesExample,w).replace(/<START>/gi,'—').slice(0,1500)}`:''}`}
function triggeredLore(w,recentText){const out=[];const low=recentText.toLowerCase();const hit=(k,cs)=>k&&(cs?recentText.includes(k):low.includes(String(k).toLowerCase()));
  for(const e of w.lorebook){if(!e.enabled)continue;if(e.charId&&!w.charIds.includes(e.charId))continue;if(e.always){out.push(e);continue}
    const p=(e.keys||[]).some(k=>hit(k,e.caseSensitive));if(!p)continue;
    if(e.selective&&(e.secondaryKeys||[]).length&&!(e.secondaryKeys||[]).some(k=>hit(k,e.caseSensitive)))continue;
    out.push(e)}
  return out.sort((a,b)=>(a.order??100)-(b.order??100))}
function floorText(f){return f.swipes[f.si]||''}
function buildPrompt(w,opts={}){
  const cs=chars(w), st=S.settings, extraUser=opts.userText||'';
  const vis=w.floors.filter(f=>!f.hidden);
  const recent=vis.slice(-4).map(floorText).join('\n')+'\n'+extraUser;
  const lore=triggeredLore(w,recent);
  const mode=REPLY_MODES.find(m=>m.id===st.replyMode)||REPLY_MODES[1];
  const pov=st.pov==='second'?'以第二人称「你」称呼 '+w.user.name+' 来叙述':'以第三人称叙述';
  const cardSys=st.preferCardPrompt!==false?cs.find(c=>c.systemPrompt)?.systemPrompt:'';
  const stableLore=lore.filter(e=>e.always), dynLore=lore.filter(e=>!e.always);
  const head=[
    `【预设】\n${fillVars(cardSys||preset(w).text,w)}`,
    `【用户扮演的角色】\n${w.user.name}：${w.user.desc||'—'}\n（${w.user.name} 由用户本人扮演，你不能替 ${w.user.name} 做决定。）`,
    `【角色卡（这些角色由你扮演；世界书里的人物与临时路人 NPC 也由你扮演）】\n${cs.map(c=>charBlock(c,w)).join('\n\n')}`,
    stableLore.length?`【世界书 · 常驻条目】\n${stableLore.map(e=>`◆ ${e.title}\n${fillVars(e.content,w)}`).join('\n\n')}`:'',
  ];
  const dyn=[
    dynLore.length?`【世界书 · 本轮触发】\n${dynLore.map(e=>`◆ ${e.title}\n${fillVars(e.content,w)}`).join('\n\n')}`:'',
    `【当前状态】\n日期：${w.state.date||'—'}　时间：${w.state.time||'—'}　地点：${w.state.place||'—'}　天气：${w.state.weather||'—'}\n在场：${w.state.present||'—'}`,
    w.relations.length?`【人物关系】\n${w.relations.map(r=>`${r.a} ↔ ${r.b}：${r.label}`).join('\n')}`:'',
    w.notes.length?`【重要记忆点】\n${w.notes.slice(-15).map(n=>`(#${n.n}) ${n.text}`).join('\n')}`:'',
    phoneDigest(w),
  ];
  const rules=`【回复规则】
- ${pov}；写小说正文，${LENGTHS.find(l=>l.id===st.length)?.label.split('·')[1].trim()||'约800字'}（这是硬性要求，宁可多写环境与心理也要达到字数）。
- ${fillVars(mode.text,w)}
- 在场的 NPC 要自然地融入场景：有自己的目的、日程与情绪，会插话、会离开、会带来新信息，不为撮合主角而工具化；不在场的人可以通过消息、电话、传闻出现。
- 保持时间线连续；如果剧情中时间流逝，更新状态。
- 正文写完后，另起一行输出一个状态块，格式严格如下（JSON 单行，不要加代码围栏）：
<state>{"date":"日期","time":"时间","place":"地点","weather":"天气","present":"在场人物","inner":"${cs[0]?.name||'角色'}此刻的真实心声（一两句，第一人称）","relations":[{"a":"人物A","b":"人物B","label":"当前关系一词","note":"本楼的变化原因，没有变化则省略此项"}],"memory":["本楼值得长期记住的事，最多3条，没有则空数组"],"model":"你自己的模型名称与版本（如 Claude Sonnet 4.6；不确定就写你最可能的名字）"}</state>`
  +cs.filter(c=>c.postHistory).map(c=>`\n【${c.name} 的附加指令】\n${fillVars(c.postHistory,w)}`).join('')
  +cs.filter(c=>c.depthPrompt?.prompt).map(c=>`\n【${c.name} 附注】\n${fillVars(c.depthPrompt.prompt,w)}`).join('');
  // 稳定部分放最前（预设/角色/常驻世界书），便于提示词缓存；动态部分（状态/检索/规则）放在最后一条用户消息里
  const first={role:'user',content:head.filter(Boolean).join('\n\n')+'\n\n（以下是至今为止的剧情。回复规则与当前状态会在最后给出。）'};
  const dynText=()=>dyn.filter(Boolean).join('\n\n')+'\n\n'+rules;
  const ft=f=>applyRegex(floorText(f),f.role==='user'?'user':'ai','prompt',w);
  let turns=[], omitted=0, budget=SAFE_BYTES-bytes(first.content)-bytes(dynText())-bytes(extraUser)-3*KB;
  const hist=vis.slice(); let used=0; const kept=[];
  for(let i=hist.length-1;i>=0;i--){const b=bytes(ft(hist[i]))+20;if(used+b>budget){omitted=i+1;break}used+=b;kept.unshift(hist[i])}
  const inContext=new Set(kept.map(f=>f.id));
  // FTS recall among floors NOT in context
  let recall=[];
  if(w.floors.length){const cands=new Set(w.floors.filter(f=>!inContext.has(f.id)).map(f=>f.id));
    if(cands.size){if(opts.recall){recall=opts.recall.filter(r=>cands.has(r.f.id))}else{FTS.build(w.floors);const q=(extraUser||'')+' '+(vis.slice(-1).map(floorText)[0]||'');recall=FTS.search(q,cands,S.settings.ftsK||15).map(([id,s])=>({f:w.floors.find(x=>x.id===id),s}))}}}
  if(recall.length){const rb=recall.map(r=>`(#${r.f.n}) ${floorText(r.f).slice(0,400)}`).join('\n\n');dyn.push(`【记忆检索 · 来自更早楼层的片段（${BACKEND?'SQLite FTS5':'FTS'} 命中 ${recall.length} 楼）】\n${rb}`)}
  for(const f of kept){turns.push({role:f.role==='user'?'user':'assistant',content:(f.role==='user'?`${w.user.name}：`:'')+ft(f)})}
  const tail=dynText()+'\n\n';
  if(extraUser)turns.push({role:'user',content:tail+`【${w.user.name} 的新回合】\n${applyRegex(extraUser,'user','prompt',w)}`});
  else turns.push({role:'user',content:tail+(opts.continueText||(turns.length?'（请继续推进剧情，不要重复上文。）':'（开始）'))});
  const all=[first,...turns];
  return {turns:all,bytes:all.reduce((a,t)=>a+bytes(t.content),0),omitted,recall,lore,inContext};
}
function phoneDigest(w){
  const ph=w.phone;if(!ph||!ph.chats.some(c=>c.msgs.length))return '';
  const parts=[];
  for(const c of ph.chats){if(!c.msgs.length)continue;const names=c.memberIds.map(id=>personOf(id,w)?.name).filter(Boolean);
    const head=c.type==='group'?`群聊「${c.name}」（成员：${names.join('、')}、${w.user.name}；群里所有成员都知道这些内容）`:`${names[0]} 与 ${w.user.name} 的私聊（只有他们两人知道，其他角色一概不知情，不得提及）`;
    parts.push(`◆ ${head}\n${c.msgs.slice(-10).map(m=>`[${m.time||''}] ${personOf(m.from,w)?.name||'?'}：${m.amount?`（转账 ¥${m.amount}）`:''}${m.text||''}`).join('\n')}`)}
  return parts.length?`【手机聊天记录（WhatsApp）】\n${parts.join('\n\n')}`:'';
}
function parseState(text){
  const m=text.match(/<state>([\s\S]*?)<\/state>\s*$/); if(!m)return {body:text.trim(),meta:null};
  let meta=null;try{meta=JSON.parse(m[1].trim())}catch(e){try{meta=JSON.parse(m[1].trim().replace(/^```\w*|```$/g,''))}catch(e2){}}
  return {body:text.slice(0,m.index).trim(),meta};
}
function applyMeta(w,meta,n){
  if(!meta)return;
  for(const k of ['date','time','place','weather','present','inner'])if(meta[k])w.state[k]=String(meta[k]);
  if(Array.isArray(meta.relations))for(const r of meta.relations){if(!r||!r.a||!r.b||!r.label)continue;
    let ex=w.relations.find(x=>(x.a===r.a&&x.b===r.b)||(x.a===r.b&&x.b===r.a));
    if(!ex){ex={id:uid(),a:r.a,b:r.b,label:r.label,history:[]};w.relations.push(ex)}
    if(ex.label!==r.label||r.note){ex.history.push({n,label:r.label,note:r.note||''});ex.label=r.label}}
  if(Array.isArray(meta.memory))for(const t of meta.memory){if(t&&typeof t==='string')w.notes.push({n,text:t})}
  if(meta.model&&typeof meta.model==='string')S._lastSelfModel=meta.model.slice(0,60);
}

function renderCharForm(b,c){

async function summarize(w,a,bN){
  if(!AI.ok())return toast('需要在 claude.ai 里打开（或连接本地后端）才能调用 AI');
  let target;
  if(a&&bN)target=w.floors.filter(f=>f.n>=a&&f.n<=bN);
  else{const vis=w.floors.filter(f=>!f.hidden);target=vis.slice(0,Math.max(0,vis.length-S.settings.keepRecent))}
  if(target.length<2)return toast('可总结的楼层不足（至少 2 楼）');
  const range=`${target[0].n}-${target[target.length-1].n}`;
  const text=target.map(f=>`#${f.n} ${f.role==='user'?w.user.name:'剧情'}：\n${floorText(f)}`).join('\n\n');
  if(bytes(text)>50*KB)return toast('这段太长了，请用「指定范围」分几次总结',4000);
  setStatus(`正在总结 #${range}……`);busy(true);snapshot(`总结 #${range} 前`);
  try{const {text:sum}=await AI.text(`${S.settings.summaryPrompt}\n\n角色说明：${chars(w).map(c=>c.name).join('、')}；用户扮演 ${w.user.name}。\n\n===== 楼层 #${range} =====\n${text}`,{tier:S.settings.tier});
    w.lorebook.push({id:uid(),title:range,keys:[],content:sum.trim(),enabled:true,always:true,group:'总结'});
    w.summaries.push({range,t:now()});target.forEach(f=>f.hidden=true);
    markDirty(w.id);renderAll();if(panelKind==='memory')renderPanel();toast(`已总结 #${range}，写入世界书「总结」并隐藏这些楼层`,4000);
  }catch(e){toast('总结失败：'+(e.message||e.code),4000)}finally{busy(false);setStatus('')}
}

function makeBackend(url){
  url=url.replace(/\/+$/,'');
  const j=async(path,body,signal)=>{const r=await fetch(url+path,{method:body?'POST':'GET',headers:{'content-type':'application/json'},body:body?JSON.stringify(body):undefined,signal});if(!r.ok)throw new Error(`后端 ${r.status}：${(await r.text()).slice(0,200)}`);return r.json()};
  return {url,
    async health(){return j('/api/health')},
    async chat(input,o={}){
      const messages=typeof input==='string'?[{role:'user',content:input}]:input;
      const r=await fetch(url+'/api/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({model:S.settings.model||'claude-opus-5',messages}),signal:o.signal});
      if(!r.ok)throw {code:'backend',message:`后端 ${r.status}：${(await r.text()).slice(0,300)}`};
      const rd=r.body.getReader();const dec=new TextDecoder();let buf='',text='',done=null;
      while(true){const {value,done:d}=await rd.read();if(d)break;buf+=dec.decode(value,{stream:true});let i;while((i=buf.indexOf('\n\n'))>=0){const line=buf.slice(0,i).trim();buf=buf.slice(i+2);if(!line.startsWith('data:'))continue;const ev=JSON.parse(line.slice(5));if(ev.error)throw {code:'backend',message:ev.error,text};if(ev.t){text+=ev.t;o.onText&&o.onText({text,delta:ev.t})}if(ev.done){done=ev}}}
      if(done&&done.text)text=done.text;LAST_MODEL=(done&&done.model)||S.settings.model;
      return {text,truncated:!!(done&&done.truncated),model:LAST_MODEL};
    },
    async index(w){return j('/api/fts/index',{worldId:w.id,floors:w.floors.map(f=>({id:f.id,n:f.n,role:f.role,text:floorText(f)}))})},
    async search(w,q,k,exclude){const r=await j('/api/fts/search',{worldId:w.id,q,k,exclude});return r.hits.map(h=>({f:w.floors.find(x=>x.id===h.id),s:h.score})).filter(x=>x.f)},
    async getState(){return j('/api/state')},
    async putState(){return j('/api/state',{state:S})},
  };
}
async function connectBackend(verbose){
  const st=S.settings;let url=st.backendUrl;
  if(!url&&(location.protocol==='file:'||/^(localhost|127\.0\.0\.1)$/.test(location.hostname)))url=location.protocol==='file:'?'http://localhost:8787':location.origin;
  if(!url){BACKEND=null;return false}
  try{const be=makeBackend(url);const h=await be.health();if(!h.ok)throw new Error('health 不 ok');BACKEND=be;if(!MODELS.some(m=>m[0]===st.model))st.model='claude-opus-5';setStatus(`已连接本地后端 ${url} · 模型 ${st.model}${h.fts5?' · FTS5 就绪':''}`,true);return true}
  catch(e){BACKEND=null;if(verbose)toast('连不上后端：'+e.message,4500);return false}
}
function renderModelSelect(){const ts=$('#tierSel');if(BACKEND){ts.innerHTML=MODELS.map(([id,l])=>`<option value="${id}">${l}</option>`).join('');ts.value=S.settings.model;ts.onchange=()=>{S.settings.model=ts.value;markDirty()}}else{ts.innerHTML=TIERS.map(t=>`<option value="${t.id}">${t.label}</option>`).join('');ts.value=S.settings.tier;ts.onchange=()=>{S.settings.tier=ts.value;markDirty()}}}

async function generate({mode,continueText}){
  const w=world();
  if(!AI.ok()){return toast('AI 不可用：请在 claude.ai 里打开这个页面（会用你的订阅额度），或在设置里连接本地后端',5000)}
  if(!chars(w).length)return toast('先在「世界」里勾选至少一位角色');
  const ta=$('#msg');let userText='';
  if(mode==='send'){userText=ta.value.trim();if(!userText)return;w.floors.push({id:uid(),n:w.floors.length+1,role:'user',swipes:[userText],si:0,hidden:false,t:now(),meta:null});ta.value='';markDirty(w.id);renderFloors();scrollBottom()}
  let target;
  if(mode==='regen'){target=w.floors[w.floors.length-1];if(!target||target.role!=='char')return}
  let recall=null;
  if(BACKEND){try{await BACKEND.index(w);const q=(userText||'')+' '+(w.floors.filter(f=>!f.hidden).slice(-1).map(floorText)[0]||'');const pre=buildPrompt(w,{continueText});recall=await BACKEND.search(w,q,S.settings.ftsK||15,[...pre.inContext])}catch(e){console.warn('fts5',e);setStatus('后端检索失败，改用浏览器内检索：'+e.message,true)}}
  const p=buildPrompt(w,{continueText,recall});
  if(p.bytes>MAX_BYTES&&!BACKEND)return toast('提示词超过 64 KB，请先总结或隐藏一些楼层',4500);
  if(!target){target={id:uid(),n:w.floors.length+1,role:'char',charId:null,swipes:[''],si:0,hidden:false,t:now(),meta:null,_new:true};w.floors.push(target)}
  else{target.swipes.push('');target.si=target.swipes.length-1}
  renderFloors();scrollBottom();
  const art=$('#f'+target.id);const txt=$('.txt',art);txt.classList.add('stream');txt.innerHTML='<p><em>正在构思……（首次使用会弹出授权；深思模式可能要等 10-60 秒）</em></p>';
  ctl=new AbortController();busy(true);setStatus(`已发送 ${(p.bytes/KB).toFixed(1)} KB · 世界书 ${p.lore.length} 条 · 检索 ${p.recall.length} 楼${p.omitted?' · 省略前 '+p.omitted+' 楼':''}`);
  try{
    const r=await AI.text(p.turns,{signal:ctl.signal,onText:({text})=>{const {body}=parseState(text);txt.innerHTML=md(applyRegex(body.replace(/<state>[\s\S]*$/,''),'ai','display',w),{streaming:true});scrollBottom()}});
    const {body,meta}=parseState(r.text);target.swipes[target.si]=body;target.meta=meta;target.model=LAST_MODEL+(!BACKEND&&meta?.model?' · 自称 '+String(meta.model).slice(0,40):'');target.truncated=!!r.truncated;applyMeta(w,meta,target.n);
    if(r.truncated)toast('回复被截断了，点「续写」可以接着写');
    setStatus(`本楼由 ${target.model||AI.label()} 生成 · ${body.length} 字`,true);snapshot(`生成 #${target.n}`);
  }catch(e){
    if(e.code==='cancelled'){const {body}=parseState(e.text||'');if(body)target.swipes[target.si]=body;else{target.swipes.splice(target.si,1);target.si=Math.max(0,target.swipes.length-1);if(!target.swipes.length)w.floors.pop()}}
    else{target.swipes.splice(target.si,1);target.si=Math.max(0,target.swipes.length-1);if(!target.swipes.length)w.floors.pop();toast(({not_granted:'你拒绝了 AI 授权，本次页面无法生成',rate_limited:'请求太频繁，稍等再试',prompt_too_large:'提示词过大，请总结或隐藏楼层'})[e.code]||('生成失败：'+(e.message||e.code)),5000)}
  }finally{ctl=null;busy(false);renumber(w);markDirty(w.id);const keep=$('#status').textContent;renderAll();$('#status').textContent=keep}
}

let phoneChat=null, phoneBusy=false;
function ensurePhone(w){if(!w.phone)w.phone={chats:[],wallet:{balance:3000,tx:[]}};for(const c of contacts(w)){if(!w.phone.chats.some(x=>x.type==='dm'&&x.memberIds[0]===c.id))w.phone.chats.push({id:uid(),type:'dm',name:c.name,memberIds:[c.id],msgs:[],unread:0})}
  // 联系人已不在本世界（角色被移出 / 人物条目停用）的私聊，只保留有消息的
  w.phone.chats=w.phone.chats.filter(c=>c.type==='group'||c.msgs.length||personOf(c.memberIds[0],w));return w.phone}
function chatName(c,w=world()){return c.type==='group'?c.name:(personOf(c.memberIds[0],w)?.name||c.name)}

【规则】
- 像真人在手机上打字：每条很短（多数不超过 25 字），可以连发 1-4 条，口语化，用词、标点、表情/颜文字、省略号、语气词都要符合各自人设（有的人惜字如金，有的人一条接一条）。
- 不写动作描写、不写旁白、不加引号，不替 ${w.user.name} 说话。
- 结合此刻的世界状态：如果他正在忙、在睡、在直播，可以晚回、敷衍、只回一个字，甚至这轮不回（返回空数组）。
- 群聊里各成员按性格回复，不必每个人都回；私聊里只能用这个角色的口吻。
- 私聊内容其他角色不知道；不要提及你不该知道的私聊。
- 如果剧情合理，可以转账（例如替对方付钱、发红包），用 "amount" 字段，数字，附一句话。
只回复 JSON 数组，例如：[{"from":"${members[0].name}","text":"嗯"},{"from":"${members[0].name}","text":"到家了？"}]，或转账 {"from":"名字","text":"拿去买奶茶","amount":50}。`;
  phoneBusy=true;const box=$('#phMsgs',b);if(box){const t=document.createElement('div');t.className='bub them typing';t.textContent='对方正在输入…';box.appendChild(t);box.scrollTop=box.scrollHeight}
  try{const r=await AI.json(prompt,{tier:'quick'});const list=Array.isArray(r)?r:[];
    for(const m of list){if(!m||(!m.text&&!m.amount))continue;const who=members.find(x=>x.name===m.from)||members[0];const amount=Number(m.amount)||0;if(amount>0){ph.wallet.balance+=amount;ph.wallet.tx.push({t:now(),amount,from:who.name,note:m.text||''})}
      await new Promise(r=>setTimeout(r,350+Math.min(1200,String(m.text||'').length*40)));
      pushMsg(c,{from:who.id,text:String(m.text||''),amount:amount||undefined});if(phoneChat!==c.id||!$('#drawer').classList.contains('open')||dtab!=='phone')c.unread=(c.unread||0)+1;
      if(phoneChat===c.id&&dtab==='phone'){const bx=$('#phMsgs');if(bx){bx.querySelector('.typing')?.remove();bx.insertAdjacentHTML('beforeend',bubble(c.msgs[c.msgs.length-1],c,w));if(list.indexOf(m)<list.length-1){const t=document.createElement('div');t.className='bub them typing';t.textContent='对方正在输入…';bx.appendChild(t)}bx.scrollTop=bx.scrollHeight}}}
    if(!list.length)toast(`${members.map(m=>m.name).join('、')} 没有回复……`);
  }catch(e){toast('回复失败：'+(e.message||e.code),4000)}
  finally{phoneBusy=false;$('#phMsgs .typing')?.remove();markDirty(w.id);renderPlusDot();if(phoneChat===c.id&&dtab==='phone'&&$('#drawer').classList.contains('open'))renderPhone($('#drawerBody'))}
}
function relGraph(w){
  const names=[...new Set(w.relations.flatMap(r=>[r.a,r.b]))];if(!names.length)return '';
  const W=380,H=260,cx=W/2,cy=H/2,R=Math.min(W,H)/2-40;const pos={};names.forEach((n,i)=>{const a=-Math.PI/2+i*2*Math.PI/names.length;pos[n]=[cx+R*Math.cos(a),cy+R*Math.sin(a)]});
  const edges=w.relations.map((r,i)=>{const [x1,y1]=pos[r.a],[x2,y2]=pos[r.b];const t=.38+(i%3)*.12;const lx=x1+(x2-x1)*t,ly=y1+(y2-y1)*t;const lab=String(r.label).slice(0,8);const bw=lab.length*11.5+10;return `<g class="e"><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/><rect x="${lx-bw/2}" y="${ly-9}" width="${bw}" height="18" rx="9" fill="var(--surface)" stroke="var(--line)"/><text x="${lx}" y="${ly+4}" text-anchor="middle">${esc(lab)}</text></g>`}).join('');
  const nodes=names.map(n=>{const [x,y]=pos[n];const c=S.characters.find(ch=>ch.name===n);return `<g class="n"><circle cx="${x}" cy="${y}" r="20" ${c?`style="stroke:${c.color}"`:''}/><text x="${x}" y="${y+5}" text-anchor="middle" font-size="13">${esc(n.slice(0,3))}</text></g>`}).join('');
  return `<svg class="graph" viewBox="0 0 ${W} ${H}">${edges}${nodes}</svg>`;
}

/* ---------------- init ---------------- */
function bindUI(){
  document.addEventListener('click',e=>{const nb=e.target.closest('[data-nav]');if(nb)openPanel(nb.dataset.nav)});
  $('#panelClose').onclick=()=>openPanel(panelKind);
  $('#drawerClose').onclick=()=>$('#drawer').classList.remove('open');
  $('#plusBtn').onclick=()=>{$('#drawer').classList.contains('open')?$('#drawer').classList.remove('open'):openDrawer()};
  $('#send').onclick=()=>generate({mode:'send'});
  $('#contBtn').onclick=()=>generate({mode:'continue'});
  $('#inspireBtn').onclick=inspire;
  $('#stop').onclick=()=>ctl?.abort();
  $('#msg').addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();generate({mode:'send'})}});
  let ct;$('#msg').addEventListener('input',()=>{clearTimeout(ct);ct=setTimeout(renderCtx,400)});
  const rm=$('#replyMode');rm.innerHTML=REPLY_MODES.map(m=>`<option value="${m.id}">${m.label}</option>`).join('');rm.value=S.settings.replyMode;rm.onchange=()=>{S.settings.replyMode=rm.value;markDirty();renderCtx()};
  const ls_=$('#lenSel');ls_.innerHTML=LENGTHS.map(l=>`<option value="${l.id}">${l.label}</option>`).join('');ls_.value=S.settings.length;ls_.onchange=()=>{S.settings.length=+ls_.value;markDirty();renderCtx()};
  renderModelSelect();
  window.addEventListener('beforeunload',()=>{if(dirty.size||saveT)saveLocal()});
}
(async function init(){
  try{await IDB.open()}catch(e){console.warn('IndexedDB 不可用，退回 localStorage')}
  S=migrate((await loadLocal())||seedState());if(dirty.size)markDirty();
  const def=seedState().settings;
  applySettings();renderRail();bindUI();renderAll();
  if(!window.claude||!window.claude.use){
    setStatus('离线模式：正在寻找本地后端……');
    const ok=await connectBackend(false);renderModelSelect();
    if(ok){try{const r=await BACKEND.getState();if(r.state&&(r.state.updatedAt||0)>(S.updatedAt||0)){S=migrate(r.state);applySettings();renderAll();renderModelSelect();toast('已从本地后端载入存档')}else{await BACKEND.putState()}}catch(e){console.warn(e)}
      const _md=markDirty;markDirty=function(x){_md(x);clearTimeout(markDirty._bt);markDirty._bt=setTimeout(()=>BACKEND&&BACKEND.putState().catch(()=>{}),1200)}}
    else setStatus('离线模式：数据只保存在这个浏览器里。要用 AI，请在 claude.ai 里打开，或运行本地后端后在设置里连接。',false);
    return}
  const [db,sample,dl]=await Promise.all([claude.use('db'),claude.use('sample'),claude.use('downloads')]);
  SAMPLE=sample;DOWNLOADS=dl;DB=db;
  if(!SAMPLE)setStatus('AI 未授权：发送时会提示授权，或此视图不支持 AI。',true);
  if(S.settings.backendUrl){await connectBackend(false);renderModelSelect()}
  if(DB){try{const remote=await loadFromDb();if(remote&&remote.updatedAt>=(S.updatedAt||0)){S=migrate(remote);if(dirty.size)markDirty();applySettings();renderAll();$('#replyMode').value=S.settings.replyMode;$('#lenSel').value=S.settings.length;renderModelSelect();if(panelKind)renderPanel();toast('已从云端载入存档')}else if(!remote){saveAll()}}catch(e){console.warn('db load',e);setStatus('云端读取失败，使用本地数据。',true)}}
})();
