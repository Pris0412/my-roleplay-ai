<title>墨夜书房</title>
<meta name="description" content="沉浸式 AI 角色扮演书房：剧情、小手机、世界书、长期记忆。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@400;500;700&family=ZCOOL+XiaoWei&display=swap">
<style>
:root{
  --bg:#F3F2EE; --surface:#FFFFFF; --raised:#ECEAE4; --sunk:#E6E3DB;
  --text:#23262D; --muted:#6B6E76; --faint:#9A9CA3;
  --accent:#B27418; --accent-soft:#F1E3C8; --accent-ink:#5A3A08;
  --good:#3E8A65; --good-soft:#DDEDE3; --danger:#B8493A; --danger-soft:#F4DCD8; --warn:#A8651E;
  --line:#DDDAD2; --line-strong:#C9C5BA;
  --shadow:0 10px 30px rgba(30,25,10,.10);
  --user-tint:#F7F0E2;
  --display:'ZCOOL XiaoWei','Noto Serif SC',serif;
  --serif:'Noto Serif SC','Songti SC','SimSun',serif;
  --sans:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
  --ui:17px; --prose:19px; --prose-font:var(--serif);
  --rail:84px; --dock:340px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171D; --surface:#1D2028; --raised:#262A34; --sunk:#111318;
    --text:#E8E3D8; --muted:#9A968C; --faint:#6E6B64;
    --accent:#E0A75A; --accent-soft:#3A2E1B; --accent-ink:#F6DDB0;
    --good:#7FB59A; --good-soft:#1F3129; --danger:#D9776A; --danger-soft:#3A2420; --warn:#E0A75A;
    --line:#2E323D; --line-strong:#3D4250;
    --shadow:0 12px 36px rgba(0,0,0,.45);
    --user-tint:#211F1A;
  }
}
:root[data-theme="dark"]{
  --bg:#15171D; --surface:#1D2028; --raised:#262A34; --sunk:#111318;
  --text:#E8E3D8; --muted:#9A968C; --faint:#6E6B64;
  --accent:#E0A75A; --accent-soft:#3A2E1B; --accent-ink:#F6DDB0;
  --good:#7FB59A; --good-soft:#1F3129; --danger:#D9776A; --danger-soft:#3A2420; --warn:#E0A75A;
  --line:#2E323D; --line-strong:#3D4250;
  --shadow:0 12px 36px rgba(0,0,0,.45);
  --user-tint:#211F1A;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:var(--ui);line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;line-height:1.3;transition:background .15s,border-color .15s}
button:hover{border-color:var(--line-strong);background:var(--raised)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
button.primary:hover{filter:brightness(1.07)}
button.ghost{background:transparent;border-color:transparent;color:var(--muted)}
button.ghost:hover{background:var(--raised);color:var(--text)}
button.small{padding:4px 10px;font-size:.88em;border-radius:8px}
button.danger{color:var(--danger);border-color:var(--danger-soft)}
button:disabled{opacity:.5;cursor:default}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%}
textarea{resize:vertical;min-height:90px;line-height:1.6}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 12px) 55%;background-size:6px 6px;background-repeat:no-repeat;padding-right:32px}
label.field{display:block;margin-bottom:14px}
label.field>span{display:block;font-size:.85em;color:var(--muted);margin-bottom:5px;letter-spacing:.04em}
h1,h2,h3,h4{margin:0;font-weight:500;text-wrap:balance}
h2{font-family:var(--display);font-size:1.7em;letter-spacing:.02em}
h3{font-size:1.15em;font-weight:600}
.eyebrow{font-size:.78em;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.num{font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:.82em;background:var(--raised);color:var(--muted);white-space:nowrap}
.pill.accent{background:var(--accent-soft);color:var(--accent-ink)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.danger{background:var(--danger-soft);color:var(--danger)}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--danger);color:#fff;font-size:.75em;display:inline-flex;align-items:center;justify-content:center;font-weight:600}
[hidden]{display:none!important}

/* ---------- app shell ---------- */
#app{display:grid;grid-template-columns:var(--rail) 1fr;height:100dvh;overflow:hidden}
#rail{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:stretch;padding:14px 8px;gap:4px;overflow-y:auto}
#rail .logo{font-family:var(--display);font-size:1.25em;text-align:center;line-height:1.15;padding:6px 0 14px;color:var(--accent);letter-spacing:.06em}
.navbtn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px;border-radius:12px;border:none;background:transparent;color:var(--muted);font-size:.8em;position:relative}
.navbtn svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.navbtn:hover{background:var(--raised);color:var(--text)}
.navbtn.active{background:var(--accent-soft);color:var(--accent-ink)}
.navbtn .badge{position:absolute;top:6px;right:10px}
#main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.view{display:none;flex:1;min-height:0;overflow:hidden}
.view.active{display:flex;flex-direction:column}
.page{flex:1;overflow-y:auto;padding:28px clamp(16px,4vw,48px) 60px}
.page-inner{max-width:920px;margin:0 auto}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.page-head p{margin:4px 0 0;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px}
.card+.card{margin-top:16px}
.card h3{margin-bottom:12px}
.stack{display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.list{display:flex;flex-direction:column}
.list-item{display:flex;align-items:center;gap:12px;padding:12px 6px;border-bottom:1px solid var(--line);cursor:pointer}
.list-item:last-child{border-bottom:none}
.list-item:hover{background:var(--raised)}
.list-item.active{background:var(--accent-soft)}
.avatar{width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:1.2em;background:var(--raised);flex-shrink:0;font-family:var(--display)}
.avatar.lg{width:64px;height:64px;font-size:1.7em}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:12px;box-shadow:var(--shadow);z-index:200;font-size:.95em;max-width:90vw;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

/* ---------- story ---------- */
#view-story{flex-direction:row}
#story-col{flex:1;display:flex;flex-direction:column;min-width:0}
#storybar{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
#storybar .world-btn{display:flex;align-items:center;gap:10px;border:none;background:transparent;padding:4px 8px;border-radius:12px}
#storybar .world-btn:hover{background:var(--raised)}
#storybar .world-name{font-family:var(--display);font-size:1.25em;letter-spacing:.03em}
#storybar .world-sub{font-size:.8em;color:var(--muted)}
.ctx-meter{display:flex;align-items:center;gap:8px;font-size:.82em;color:var(--muted)}
.ctx-meter .bar{width:110px;height:6px;border-radius:4px;background:var(--sunk);overflow:hidden}
.ctx-meter .bar i{display:block;height:100%;background:var(--good);width:0%}
.ctx-meter.warn .bar i{background:var(--warn)}
.ctx-meter.over .bar i{background:var(--danger)}
#floors{flex:1;overflow-y:auto;padding:26px clamp(14px,4vw,40px) 40px;scroll-behavior:smooth}
.chapter-head{max-width:46em;margin:0 auto 26px;text-align:center}
.chapter-head .title{font-family:var(--display);font-size:1.9em;letter-spacing:.06em}
.chapter-head .sub{color:var(--muted);font-size:.9em;margin-top:6px}
.floor{max-width:46em;margin:0 auto 22px;position:relative;font-family:var(--prose-font);font-size:var(--prose);line-height:1.95}
.floor .meta{font-family:var(--sans);font-size:.72em;color:var(--faint);display:flex;align-items:center;gap:10px;margin-bottom:6px;letter-spacing:.04em}
.floor .meta .who{color:var(--muted);font-weight:500}
.floor .meta .alts{display:inline-flex;align-items:center;gap:2px;margin-left:auto}
.floor .meta .alts button{padding:0 6px;border:none;background:transparent;color:var(--muted);font-size:1.05em}
.floor .body p{margin:0 0 .9em;text-align:justify;text-justify:inter-ideograph}
.floor .body p:last-child{margin-bottom:0}
.floor .body em{color:var(--muted);font-style:normal}
.floor .body q,.floor .body .say{color:var(--accent-ink)}
.floor.user{padding-left:18px;border-left:3px solid var(--accent);background:linear-gradient(90deg,var(--user-tint),transparent 70%);border-radius:0 12px 12px 0;padding-top:10px;padding-bottom:10px;padding-right:12px}
.floor.system .body{font-family:var(--sans);font-size:.85em;color:var(--muted);text-align:left;white-space:pre-wrap;padding:10px 14px;border:1px dashed var(--line);border-radius:10px;line-height:1.6}
.floor .actions{font-family:var(--sans);font-size:.74em;display:flex;gap:2px;margin-top:8px;opacity:0;transition:opacity .15s;flex-wrap:wrap}
.floor:hover .actions,.floor:focus-within .actions,.floor.touched .actions{opacity:1}
.floor .actions button{border:none;background:transparent;color:var(--muted);padding:3px 8px;border-radius:8px}
.floor .actions button:hover{background:var(--raised);color:var(--text)}
.floor.streaming .body::after{content:"▍";color:var(--accent);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.floor .body textarea{width:100%;font-family:var(--prose-font);font-size:1em;line-height:1.8;min-height:160px}
.chapter-div{max-width:46em;margin:34px auto 26px;text-align:center;font-family:var(--display);font-size:1.25em;letter-spacing:.08em;color:var(--accent);position:relative}
.chapter-div::before,.chapter-div::after{content:"";position:absolute;top:50%;width:18%;border-top:1px solid var(--line-strong)}
.chapter-div::before{left:0}.chapter-div::after{right:0}
.chapter-div small{display:block;font-family:var(--sans);font-size:.65em;color:var(--muted);letter-spacing:.04em}
.hidden-bar{max-width:46em;margin:0 auto 22px;text-align:center;font-size:.85em;color:var(--muted);border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);padding:8px}
.hidden-bar button{margin-left:8px}
.floor.is-hidden{opacity:.55}
.floor.is-hidden .meta::after{content:"已隐藏 · 不入上下文";color:var(--warn)}

#composer{border-top:1px solid var(--line);background:var(--surface);padding:10px 16px 12px}
#composer .inner{max-width:52em;margin:0 auto}
.shortcuts{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.shortcuts button{padding:3px 10px;font-size:.88em;border-radius:8px;background:var(--raised);border-color:transparent}
#composer textarea{min-height:70px;max-height:40vh;font-family:var(--prose-font);font-size:calc(var(--prose) - 1px);line-height:1.7;border-radius:12px}
.composer-tools{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.composer-tools select{width:auto;padding:6px 30px 6px 10px;font-size:.88em;border-radius:8px}
.composer-tools .send{margin-left:auto;display:flex;gap:8px}
.tool-lbl{font-size:.78em;color:var(--faint);margin-right:-4px}

/* dock (状态面板) */
#dock{width:var(--dock);border-left:1px solid var(--line);background:var(--surface);overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:14px}
#dock h3{font-family:var(--display);font-weight:400;font-size:1.25em;letter-spacing:.04em}
.dock-block{border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.dock-block .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.92em}
.dock-block .kv span:nth-child(odd){color:var(--muted)}
details.inner summary{cursor:pointer;color:var(--muted);font-size:.9em;list-style:none;display:flex;align-items:center;gap:8px}
details.inner summary::before{content:"▸";transition:transform .15s}
details.inner[open] summary::before{transform:rotate(90deg)}
details.inner .voice{font-family:var(--serif);margin-top:10px;padding:12px 14px;border-left:3px solid var(--accent);background:var(--user-tint);border-radius:0 10px 10px 0;line-height:1.8}
.npc-line{display:flex;gap:10px;align-items:baseline;font-size:.92em;padding:4px 0;border-bottom:1px dashed var(--line)}
.npc-line:last-child{border-bottom:none}
.npc-line b{font-weight:500;min-width:3.2em}

/* ---------- phone ---------- */
#view-phone .page{display:flex;justify-content:center;align-items:flex-start}
.phone{width:min(420px,100%);height:min(820px,calc(100dvh - 60px));background:var(--sunk);border:10px solid var(--text);border-radius:44px;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow);position:relative}
.phone .statusbar{display:flex;justify-content:space-between;padding:10px 24px 4px;font-size:.78em;color:var(--muted)}
.phone .screen{flex:1;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.phone .homebar{height:26px;display:flex;align-items:center;justify-content:center}
.phone .homebar i{width:120px;height:5px;border-radius:3px;background:var(--line-strong)}
.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 8px;padding:26px 22px}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;border:none;background:transparent;padding:0;font-size:.78em;color:var(--text);position:relative}
.app .icon{width:60px;height:60px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:1.7em;color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.app .badge{position:absolute;top:-6px;right:14px}
.app-screen{display:none;flex:1;flex-direction:column;min-height:0;background:var(--surface)}
.app-screen.active{display:flex}
.app-head{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface)}
.app-head b{font-weight:600;flex:1}
.app-body{flex:1;overflow-y:auto;min-height:0}
.chatlist .list-item{padding:12px 14px}
.chatlist .preview{font-size:.85em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bubbles{padding:14px 12px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.bubble{max-width:78%;padding:9px 13px;border-radius:16px;background:var(--surface);font-size:.95em;line-height:1.5;border:1px solid var(--line);position:relative}
.bubble.me{align-self:flex-end;background:var(--accent-soft);border-color:transparent;color:var(--accent-ink)}
.bubble .from{font-size:.75em;color:var(--muted);margin-bottom:2px}
.bubble .time{font-size:.7em;color:var(--faint);text-align:right;margin-top:2px}
.bubble.money{background:var(--good-soft);border-color:transparent;color:var(--good);font-weight:500}
.bubble.sys{align-self:center;background:transparent;border:none;color:var(--faint);font-size:.8em}
.chat-input{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);background:var(--surface)}
.chat-input input{flex:1}
.ig-post{border-bottom:1px solid var(--line);padding:12px 14px}
.ig-post .head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.ig-post .pic{height:210px;border-radius:12px;display:flex;align-items:flex-end;padding:12px;color:#fff;font-family:var(--serif);text-shadow:0 1px 6px rgba(0,0,0,.5);font-size:1.05em}
.ig-post .caption{margin-top:8px;font-size:.95em}
.ig-post .stats{font-size:.8em;color:var(--muted);margin-top:4px}
.wallet{padding:22px 18px}
.wallet .balance{font-size:2.4em;font-family:var(--display);letter-spacing:.04em}
.tx{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:.95em}
.tx .amt.in{color:var(--good)} .tx .amt.out{color:var(--danger)}

/* ---------- forum / diary ---------- */
.board-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.board-tabs button.active{background:var(--accent-soft);border-color:transparent;color:var(--accent-ink)}
.thread{padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}
.thread:hover .t-title{color:var(--accent)}
.t-title{font-weight:600;font-size:1.05em}
.t-meta{font-size:.82em;color:var(--muted);margin-top:2px}
.t-post{padding:14px 0;border-bottom:1px dashed var(--line);font-family:var(--serif);line-height:1.8}
.t-post .who{font-family:var(--sans);font-size:.82em;color:var(--muted);margin-bottom:4px}
.diary-entry{font-family:var(--serif);font-size:calc(var(--prose) - 1px);line-height:1.95;padding:22px 0;border-bottom:1px solid var(--line)}
.diary-entry .date{font-family:var(--display);color:var(--accent);letter-spacing:.06em;margin-bottom:6px}
.diary-entry .lock{font-family:var(--sans);font-size:.8em;color:var(--muted)}

/* ---------- records ---------- */
.graph{width:100%;height:auto;display:block}
.graph text{font-family:var(--sans);fill:var(--text);font-size:14px}
.graph .node circle{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.graph .node.user circle{fill:var(--accent)}
.graph .node.user text{fill:var(--text)}
.graph .edge{stroke:var(--line-strong);stroke-width:2.5;cursor:pointer}
.graph .edge:hover,.graph .edge.sel{stroke:var(--accent);stroke-width:4}
.graph .elabel{font-size:12px;fill:var(--muted);pointer-events:none}
.hist{border-left:2px solid var(--line);padding-left:14px;margin-left:6px}
.hist div{padding:6px 0;font-size:.95em}
.hist div b{font-weight:500;color:var(--accent-ink)}
.mp{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.95em}
.mp .no{color:var(--muted);min-width:4.5em;font-variant-numeric:tabular-nums}

/* ---------- memory ---------- */
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat{padding:12px 14px;border:1px solid var(--line);border-radius:12px}
.stat b{display:block;font-size:1.7em;font-family:var(--display);color:var(--accent)}
.stat span{font-size:.82em;color:var(--muted)}
.result{padding:12px 0;border-bottom:1px solid var(--line);font-size:.95em}
.result mark{background:var(--accent-soft);color:var(--accent-ink);padding:0 2px;border-radius:3px}
.result .r-meta{font-size:.8em;color:var(--muted);margin-bottom:2px;display:flex;gap:10px}
.sum-entry{padding:12px 0;border-bottom:1px solid var(--line)}
.sum-entry .r-meta{display:flex;gap:10px;align-items:center;font-size:.85em;color:var(--muted);margin-bottom:4px}
.sum-entry pre{white-space:pre-wrap;font-family:var(--serif);margin:0;font-size:.95em;line-height:1.7}

/* ---------- editors ---------- */
.block{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:var(--surface)}
.block .b-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.block .b-head input[type=text]{flex:1;padding:6px 10px}
.block textarea{font-size:.95em}
.block.off{opacity:.55}
.switch{display:inline-flex;align-items:center;gap:6px;font-size:.85em;color:var(--muted);cursor:pointer;white-space:nowrap}
.switch input{width:auto;margin:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--raised);padding:3px 10px;border-radius:999px;font-size:.85em;display:inline-flex;align-items:center;gap:6px}
.chip button{border:none;background:transparent;padding:0 2px;color:var(--muted)}
.char-card{display:flex;gap:14px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:14px;cursor:pointer;background:var(--surface)}
.char-card.active{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.char-card .sub{font-size:.85em;color:var(--muted)}
.npc-card{border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:.95em}
.npc-card b{font-weight:600}

/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;background:rgba(10,10,12,.45);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.overlay.show{display:flex}
.modal{background:var(--surface);border-radius:18px;width:min(760px,100%);max-height:90dvh;display:flex;flex-direction:column;box-shadow:var(--shadow);border:1px solid var(--line)}
.modal .m-head{display:flex;align-items:center;gap:10px;padding:16px 22px;border-bottom:1px solid var(--line)}
.modal .m-head h3{flex:1;font-family:var(--display);font-weight:400;font-size:1.3em}
.modal .m-body{padding:18px 22px;overflow-y:auto}
.modal .m-foot{padding:12px 22px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.prompt-pre{white-space:pre-wrap;font-family:var(--sans);font-size:.88em;line-height:1.6;background:var(--sunk);padding:14px;border-radius:12px;max-height:60vh;overflow:auto}
.prompt-pre .seg{color:var(--accent);font-weight:600}
.branch-node{display:flex;align-items:center;gap:10px;padding:10px 8px;border-bottom:1px solid var(--line);cursor:pointer}
.branch-node.active{background:var(--accent-soft)}
.branch-node .dot{width:10px;height:10px;border-radius:50%;background:var(--accent)}
.think{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:.9em}
.think i{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1s infinite alternate}
@keyframes pulse{to{opacity:.2}}
.banner{padding:10px 14px;border-radius:12px;background:var(--accent-soft);color:var(--accent-ink);font-size:.92em;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.danger{background:var(--danger-soft);color:var(--danger)}
.banner.good{background:var(--good-soft);color:var(--good)}

/* ---------- mobile ---------- */
#tabbar{display:none}
@media (max-width:860px){
  #app{grid-template-columns:1fr;grid-template-rows:1fr auto}
  #rail{display:none}
  #tabbar{display:flex;border-top:1px solid var(--line);background:var(--surface);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}

}

/* 本地后端在线时，把索引镜像进 SQLite FTS5（永久记忆库） */
async function ftsSync(){if(!AI.backendOk)return;try{const rows=[...MEM.docs.entries()].map(([id,d])=>({id,worldId:d.worldId,no:d.no,who:d.who,kind:d.kind,text:d.text}));await fetch(S.settings.backendUrl.replace(/\/$/,'')+'/api/memory/sync',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({rows})});}catch(e){}}
const W=()=>S.worlds.find(w=>w.id===S.activeWorldId)||S.worlds[0];
const C=w=>S.chars.find(c=>c.id===(w||W()).charId)||S.chars[0];
const P=()=>S.presets.find(p=>p.id===S.activePresetId)||S.presets[0];
function fill(t,w){const c=C(w);return String(t||'').replaceAll('{{char}}',c?.name||'角色').replaceAll('{{user}}',S.user.name||'你');}
function floorText(fl){return fl.alts[fl.alt]??'';}

/* 分支：可见楼层 = 祖先分支在分叉点之前的楼 + 本分支的楼 */
function branchChain(w,bid){const out=[];let b=w.branches.find(x=>x.id===bid);while(b){out.unshift(b);b=w.branches.find(x=>x.id===b.parentId);}return out;}
function visibleFloors(w=W()){
 const chain=branchChain(w,w.activeBranchId);const res=[];
 for(let i=0;i<chain.length;i++){const b=chain[i];const child=chain[i+1];const cut=child?child.forkAt:Infinity;
  res.push(...w.floors.filter(f=>f.branchId===b.id&&f.no<=cut));}
 return res.sort((a,b)=>a.no-b.no);
}
function chapters(w=W()){const mb=memoryBook(w);const list=mb.entries.filter(e=>e.from).sort((a,b)=>a.from-b.from).map((e,i)=>({idx:i+1,title:e.chapter||('第 '+(i+1)+' 章'),from:e.from,to:e.to,done:true}));
 const last=list.length?list[list.length-1].to:0;const vis=visibleFloors(w);if(vis.length&&vis[vis.length-1].no>last)list.push({idx:list.length+1,title:'第 '+(list.length+1)+' 章 · 进行中',from:last+1,to:vis[vis.length-1].no,done:false});return list;}
function chapterOf(w,no){return chapters(w).find(c=>no>=c.from&&no<=c.to);}
function nextNo(w=W()){const v=visibleFloors(w);return v.length?v[v.length-1].no+1:1;}

/* ---------------- 记忆索引（二元分词倒排索引） ---------------- */
const MEM={idx:new Map(),docs:new Map(),count:0};
function grams(t){const s=String(t).toLowerCase().replace(/\s+/g,' ');const g=new Set();
 const cjk=s.match(/[㐀-鿿]+/g)||[];for(const seg of cjk){if(seg.length===1)g.add(seg);for(let i=0;i<seg.length-1;i++)g.add(seg.slice(i,i+2));}
 for(const w of s.match(/[a-z0-9]+/g)||[])g.add(w);return g;}
function memIndexAll(){MEM.idx.clear();MEM.docs.clear();MEM.count=0;
 for(const w of S.worlds)for(const fl of w.floors){if(fl.role==='system')continue;memAdd(w,fl);}
 for(const w of S.worlds)for(const e of memoryBook(w).entries)memAddDoc(w.id+'|sum|'+e.id,{worldId:w.id,no:e.from||0,to:e.to||0,kind:'summary',text:e.content,who:'总结 '+e.title});}
function memAdd(w,fl){memAddDoc(w.id+'|'+fl.id,{worldId:w.id,no:fl.no,kind:'floor',who:fl.role==='user'?S.user.name:C(w).name,text:floorText(fl),branchId:fl.branchId});}
function memAddDoc(id,doc){if(MEM.docs.has(id))return;MEM.docs.set(id,doc);MEM.count++;for(const g of grams(doc.text)){if(!MEM.idx.has(g))MEM.idx.set(g,new Set());MEM.idx.get(g).add(id);}}
function memSearch(q,{worldId=W().id,limit=10,exclude=new Set()}={}){
 const qs=[...grams(q)];if(!qs.length)return[];const score=new Map();
 for(const g of qs){const ids=MEM.idx.get(g);if(!ids)continue;const idf=Math.log(1+MEM.count/ids.size);
  for(const id of ids){const d=MEM.docs.get(id);if(d.worldId!==worldId||exclude.has(id))continue;score.set(id,(score.get(id)||0)+idf);}}
 return [...score.entries()].sort((a,b)=>b[1]-a[1]).slice(0,limit).map(([id,sc])=>({id,score:sc,...MEM.docs.get(id)}));
}
function snippet(text,q,len=90){const gs=[...grams(q)].filter(g=>g.length>1);let pos=-1;for(const g of gs){const p=text.indexOf(g);if(p>=0&&(pos<0||p<pos))pos=p;}
 const st=Math.max(0,(pos<0?0:pos)-20);let s=text.slice(st,st+len);let h=esc(s);for(const g of gs)h=h.replaceAll(esc(g),'<mark>'+esc(g)+'</mark>');return (st>0?'…':'')+h+(st+len<text.length?'…':'');}

/* ---------------- 世界书触发 ---------------- */
function memoryBook(w){let b=S.lorebooks.find(x=>x.kind==='memory'&&x.worldId===w.id);if(!b){b={id:'lb_mem_'+w.id,name:w.name+' · 记忆',worldId:w.id,kind:'memory',entries:[]};S.lorebooks.push(b);}return b;}
function activeLoreEntries(w,scanText){
 const out=[];const books=(S.lorebooks||[]).filter(b=>b.kind!=='memory'&&(!b.worldId||b.worldId===w.id));
 const t=scanText.toLowerCase();
 for(const b of books)for(const e of b.entries){if(!e.enabled)continue;
  if(e.constant){out.push({book:b.name,...e});continue;}
  const keys=(e.keys||'').split(/[,，、]/).map(k=>k.trim().toLowerCase()).filter(Boolean);
  if(keys.some(k=>t.includes(k)))out.push({book:b.name,...e});}
 return out;
}

/* ---------------- 上下文预算与提示词组装 ---------------- */
function estTokens(s){return Math.ceil(String(s).length*0.9);}
function buildPrompt(userText,{inspire=false,upTo=Infinity,lastOverride=null}={}){
 const w=W(),c=C(w),st=S.settings;const vis=visibleFloors(w).filter(f=>!f.hidden&&f.role!=='system'&&f.no<=upTo);
 const segs=[];
 const preset=P();for(const b of preset.blocks)if(b.enabled)segs.push(['预设 · '+b.name,fill(b.content,w)]);
 const card=[`姓名：${c.name}`,c.card.description&&`设定：${c.card.description}`,c.card.personality&&`性格：${c.card.personality}`,c.card.scenario&&`情境：${c.card.scenario}`,c.card.example&&`说话示例：${c.card.example}`].filter(Boolean).join('\n');
 segs.push(['角色卡 · '+c.name,card]);
 if(c.npcs?.length)segs.push(['NPC 名册',c.npcs.map(n=>`${n.name}（${n.gender||'?'}，${n.age||'?'}岁）：${n.look||''}；性格：${n.personality||''}；与 ${c.name}：${n.relChar||'—'}；与 ${S.user.name}：${n.relUser||'—'}`).join('\n')]);
 segs.push(['用户人设 · '+S.user.name,S.user.description||'']);
 const recentText=vis.slice(-4).map(floorText).join('\n')+'\n'+userText;
 const lore=activeLoreEntries(w,recentText);if(lore.length)segs.push(['世界书（'+lore.length+' 条触发）',lore.map(e=>`【${e.title}】${e.content}`).join('\n')]);
 const mem=memoryBook(w).entries.filter(e=>e.enabled);if(mem.length)segs.push(['长期记忆 · 剧情总结',mem.map(e=>`〔第${e.title}楼〕${e.content}`).join('\n')]);
 // 检索：用 用户输入 + 最近一楼 做查询，排除即将送入的楼层
 const budget=st.contextBudget;let used=segs.reduce((a,[,t])=>a+estTokens(t),0);
 const turns=[];let i=vis.length-1;const included=new Set();
 for(;i>=0;i--){const f=vis[i];const tk=estTokens(floorText(f));if(used+tk>budget*0.8&&turns.length>=2)break;used+=tk;turns.unshift(f);included.add(w.id+'|'+f.id);}
 const dropped=i+1;
 const q=(userText||'')+' '+(vis.length?floorText(vis[vis.length-1]).slice(-200):'');
 const hits=memSearch(q,{worldId:w.id,limit:10,exclude:included}).filter(h=>h.kind==='floor');
 if(hits.length)segs.push(['相关回忆（记忆检索，'+hits.length+' 条）',hits.map(h=>`〔第${h.no}楼 · ${h.who}〕${h.text.slice(0,300)}`).join('\n')]);
 const rel=(w.relations||[]).map(r=>`${r.a} ↔ ${r.b}：${r.label}`).join('；');
 segs.push(['世界状态',`时间：${w.clock.time}；地点：${w.clock.location}；天气：${w.clock.weather}\n${c.name} 的状态：${w.status.mood}，${w.status.doing}\n关系：${rel}\n记忆点：${(w.memoryPoints||[]).slice(-8).map(m=>m.text).join('；')}`]);
 const rule=inspire
  ?`现在请你暂时切换：以 ${S.user.name} 的口吻与人设，替我起草 ${S.user.name} 的下一段回应（动作+台词，150-300 字，第三人称小说体，只写 ${S.user.name}，不要写 ${c.name} 的反应，不要输出 <state>）。`
  :`回复规则：${fill(REPLY_MODES[st.replyMode],w)}\n篇幅：本次回复正文约 ${st.length} 字（允许 ±20%），分自然段。`;
 segs.push(['回复规则',rule]);
 const instruction=segs.map(([n,t])=>`## ${n}\n${t}`).join('\n\n');
 const msgs=[{role:'user',content:instruction}];
 for(const f of turns){const role=f.role==='user'?'user':'assistant';const t=`〔第${f.no}楼〕\n`+floorText(f);
  if(msgs.length&&msgs[msgs.length-1].role===role&&msgs.length>1)msgs[msgs.length-1].content+='\n\n'+t;else msgs.push({role,content:t});}
 const last=lastOverride||(userText.trim()?`〔第${nextNo(w)}楼 · ${S.user.name}〕\n${userText.trim()}`:(inspire?'请开始起草。':'（请让剧情自然地继续。）'));
 if(msgs[msgs.length-1].role==='user')msgs[msgs.length-1].content+='\n\n'+last;else msgs.push({role:'user',content:last});
 used+=estTokens(last);
 return {msgs,segs,used,budget,dropped,turns,hits,lore};
}

/* ---------------- AI 适配层 ---------------- */
const AI={mode:'none',sample:null,backendOk:false,models:[],
 async init(){
  try{if(window.claude?.use){this.sample=await window.claude.use('sample');}}catch(e){this.sample=null;}
  if(this.sample)this.mode='sample';
  await this.probeBackend();
  renderModelSelect();renderSettings();
 },
 async probeBackend(){
  const url=S.settings.backendUrl;if(!url){this.backendOk=false;return;}
  try{const r=await fetch(url.replace(/\/$/,'')+'/api/health',{signal:AbortSignal.timeout(2500)});const j=await r.json();this.backendOk=!!j.ok;this.models=j.models||[];if(this.backendOk)this.mode='backend';}
  catch(e){this.backendOk=false;if(this.mode==='backend')this.mode=this.sample?'sample':'none';}
 },
 label(){return this.mode==='backend'?'本地后端 · Claude 订阅':this.mode==='sample'?'claude.ai 订阅额度':'未连接（演示模式）';},
 async chat(msgs,{onText,signal,json=false,tier=null}={}){
  if(this.mode==='backend'){
   const r=await fetch(S.settings.backendUrl.replace(/\/$/,'')+'/api/generate',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({messages:msgs,model:S.settings.backendModel||undefined,json}),signal});
   if(!r.ok)throw {code:'upstream_error',message:await r.text()};
   const rd=r.body.getReader();const dec=new TextDecoder();let buf='',text='';
   while(true){const {done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});
    const lines=buf.split('\n');buf=lines.pop();for(const ln of lines){if(!ln.startsWith('data:'))continue;const d=JSON.parse(ln.slice(5));if(d.delta){text+=d.delta;onText?.({text,delta:d.delta});}if(d.error)throw {code:'upstream_error',message:d.error};}}
   return json?parseJSON(text):{text};
  }
  if(this.mode==='sample'){
   const opts={cache:false,signal,modelTier:tier||S.settings.modelTier,onText};
   return json?await this.sample.json(msgs,opts):await this.sample(msgs,opts);
  }
  throw {code:'not_connected',message:'没有可用的 AI 连接'};
 }
};
function parseJSON(t){try{return JSON.parse(t);}catch(e){}const m=t.match(/```(?:json)?\s*([\s\S]*?)```/);if(m){try{return JSON.parse(m[1]);}catch(e){}}const a=t.indexOf('{'),b=t.lastIndexOf('}');if(a>=0&&b>a){try{return JSON.parse(t.slice(a,b+1));}catch(e){}}throw {code:'invalid_json',message:'返回内容不是 JSON',text:t};}
function errCopy(e){const m={not_granted:'你没有允许这个页面使用你的 Claude 额度。',rate_limited:'请求太频繁了，稍等一下再试。',prompt_too_large:'提示词太长了，试试隐藏一些楼层或降低上下文预算。',cancelled:'已停止。',invalid_json:'AI 返回的格式不对，再试一次。',not_connected:'没有可用的 AI 连接：在 claude.ai 里打开本页可直接用订阅额度，或在“设置”里连接本地后端。',refused:'这次请求被拒绝了，换个写法试试。',session_expired:'登录状态过期了，刷新页面。'};return m[e?.code]||(e?.message||'出错了');}

let gen={busy:false,ctl:null};
function renderStory(){
 const w=W(),c=C(w);
 $('#world-avatar').textContent=c.avatar||c.name[0];$('#world-avatar').style.background=c.color||'';$('#world-avatar').style.color='#fff';
 $('#world-name').textContent=w.name;const br=w.branches.find(b=>b.id===w.activeBranchId);$('#world-sub').textContent=`${c.name} · ${br?.name||'主线'}`;
 $('#world-clock').textContent=w.clock.time;
 const box=$('#floors');const vis=visibleFloors(w);const keep=box.scrollTop;box.innerHTML='';
 const chs=chapters(w);const cur=chs[chs.length-1];
 box.insertAdjacentHTML('beforeend',`<div class="chapter-head"><div class="title">${esc(w.name)}</div><div class="sub">${esc(c.name)} × ${esc(S.user.name)} · ${vis.length} 楼 · ${esc(w.clock.location)} · ${esc(w.clock.weather)}</div>${cur?`<div class="sub" style="color:var(--accent)">${esc(cur.title)}</div>`:''}</div>`);
 const hid=vis.filter(f=>f.hidden);
 if(hid.length){const first=hid[0].no,last=hid[hid.length-1].no;const arch=chs.filter(x=>x.done&&vis.some(f=>f.hidden&&f.no>=x.from&&f.no<=x.to)).map(x=>`${esc(x.title)}（${x.from}–${x.to} 楼）`).join('、');box.insertAdjacentHTML('beforeend',`<div class="hidden-bar">${arch?'已归档：'+arch+'。':''}第 ${first}–${last} 楼中有 ${hid.length} 楼已隐藏，不再进入上下文，但仍可被记忆检索 <button class="small" id="btn-showhidden">${showHidden?'收起':'展开查看'}</button></div>`);$('#btn-showhidden').onclick=()=>{showHidden=!showHidden;renderStory();};}
 for(const f of vis){if(f.hidden&&!showHidden)continue;const ch=chs.find(x=>x.from===f.no);if(ch)box.insertAdjacentHTML('beforeend',`<div class="chapter-div" id="ch-${ch.idx}">${esc(ch.title)}<small>第 ${ch.from}${ch.done?'–'+ch.to:''} 楼</small></div>`);box.append(floorEl(f,w,c));}
 if(!vis.length)box.insertAdjacentHTML('beforeend',`<div class="floor system"><div class="body">这个世界还是空白的。写下第一段，或点“发送”让 ${esc(c.name)} 开场。</div></div>`);
 box.scrollTop=keep||box.scrollHeight;
 renderShortcuts();renderDock();renderMeter();$('#sel-mode').value=S.settings.replyMode;$('#sel-len').value=S.settings.length;badges();
}
let showHidden=false;
function paras(t){return String(t).split(/\n{2,}|\n/).filter(x=>x.trim()).map(p=>'<p>'+esc(p).replace(/(“[^”]*”)/g,'<span class="say">$1</span>')+'</p>').join('');}
function floorEl(f,w,c){
 const el=document.createElement('article');el.className='floor '+f.role+(f.hidden?' is-hidden':'');el.dataset.id=f.id;el.tabIndex=0;
 const who=f.role==='user'?S.user.name:f.role==='char'?c.name:'系统';
 const alts=f.alts.length>1?`<span class="alts"><button data-act="prev" title="上一个版本">‹</button><span class="num">${f.alt+1}/${f.alts.length}</span><button data-act="next" title="下一个版本">›</button></span>`:'';
 el.innerHTML=`<div class="meta"><span class="num">第 ${f.no} 楼</span><span class="who">${esc(who)}</span><span>${esc(f.worldTime||'')}</span>${alts}</div><div class="body">${f.role==='system'?esc(floorText(f)):paras(floorText(f))}</div>
 <div class="actions">${f.role==='char'?'<button data-act="regen" title="刷出一个不同的回复">↻ 刷</button>':''}<button data-act="edit">✎ 编辑</button><button data-act="branch" title="从这一楼开一条平行剧情线">⑂ 分支</button><button data-act="rewind" title="回到这一楼，删除之后的楼层">⟲ 回溯</button><button data-act="hide">${f.hidden?'◉ 取消隐藏':'◌ 隐藏'}</button><button data-act="del">✕</button></div>`;
 el.addEventListener('click',e=>{const a=e.target.closest('[data-act]')?.dataset.act;if(!a){el.classList.toggle('touched');return;}floorAction(a,f,w,el);});
 return el;
}
function floorAction(a,f,w,el){
 if(a==='prev'||a==='next'){f.alt=(f.alt+(a==='next'?1:f.alts.length-1))%f.alts.length;save();renderStory();return;}
 if(a==='regen')return regenFloor(f);
 if(a==='edit'){const body=$('.body',el);const ta=document.createElement('textarea');ta.value=floorText(f);body.innerHTML='';body.append(ta);ta.focus();
  const bar=document.createElement('div');bar.className='row';bar.style.marginTop='8px';bar.innerHTML='<button class="small primary">保存</button><button class="small">取消</button>';body.append(bar);
  bar.children[0].onclick=()=>{f.alts[f.alt]=ta.value;MEM.docs.delete(w.id+'|'+f.id);memIndexAll();save();renderStory();};bar.children[1].onclick=()=>renderStory();return;}
 if(a==='branch'){promptBox('新分支的名字',`分支 · 自第 ${f.no} 楼`,name=>{const b={id:uid(),name:name||('分支 '+f.no),parentId:w.activeBranchId,forkAt:f.no,createdAt:now()};w.branches.push(b);w.activeBranchId=b.id;save();renderStory();toast('已切到新分支，之后的楼层只属于这条线');},'从这一楼之后开始走平行剧情，原来的线保持不变');return;}
 if(a==='rewind'){confirmBox(`回溯到第 ${f.no} 楼？当前分支里第 ${f.no} 楼之后的楼层会被删除（其他分支不受影响）。`,()=>{w.floors=w.floors.filter(x=>!(x.branchId===w.activeBranchId&&x.no>f.no));memIndexAll();save();renderStory();});return;}
 if(a==='hide'){f.hidden=!f.hidden;save();renderStory();return;}
 if(a==='del'){confirmBox(`删除第 ${f.no} 楼？`,()=>{w.floors=w.floors.filter(x=>x.id!==f.id);memIndexAll();save();renderStory();});}
}
function renderShortcuts(){const box=$('#shortcuts');box.innerHTML=S.settings.shortcuts.map((s,i)=>`<button data-i="${i}" title="插入">${esc(s)}</button>`).join('')+'<button class="ghost" id="sc-edit" title="编辑快捷键">＋</button>';
 $$('#shortcuts [data-i]').forEach(b=>b.onclick=()=>insertText(S.settings.shortcuts[+b.dataset.i]));$('#sc-edit').onclick=()=>showView('settings');}
function insertText(s){const ta=$('#input');const a=ta.selectionStart,b=ta.selectionEnd;const pair=/^(「」|（）|“”|『』|\(\)|\[\])$/.test(s);
 if(pair){const sel=ta.value.slice(a,b);ta.value=ta.value.slice(0,a)+s[0]+sel+s[1]+ta.value.slice(b);ta.selectionStart=ta.selectionEnd=a+1+sel.length;}else{ta.value=ta.value.slice(0,a)+s+ta.value.slice(b);ta.selectionStart=ta.selectionEnd=a+s.length;}ta.focus();renderMeter();}
function renderMeter(){const {used,budget,dropped}=buildPrompt($('#input').value);const pct=Math.round(used/budget*100);const m=$('#ctx-meter');m.classList.toggle('warn',pct>=70&&pct<100);m.classList.toggle('over',pct>=100||dropped>0);$('.bar i',m).style.width=Math.min(100,pct)+'%';$('#ctx-text').textContent=`${pct}%`+(dropped?` · ${dropped} 楼被挤出`:'');m.title=`约 ${used} / ${budget} tokens${dropped?`。最早的 ${dropped} 楼放不进上下文了，建议总结后隐藏它们。`:''}`;}

 else{sel.innerHTML=`<option value="quick">快 · Haiku 级</option><option value="default">均衡 · Sonnet 级</option><option value="complex">最强 · Opus 级</option>`;sel.value=S.settings.modelTier;sel.onchange=()=>{S.settings.modelTier=sel.value;save();};}}

/* ----- 生成 ----- */
function splitState(text){const m=text.match(/<state>([\s\S]*?)(<\/state>|$)/);if(!m)return {body:text.trim(),state:null};let st=null;try{st=parseJSON(m[1]);}catch(e){}return {body:text.slice(0,m.index).trim(),state:st};}
function applyState(w,st,no){if(!st||typeof st!=='object')return;
 if(st.time)w.clock.time=st.time;if(st.location)w.clock.location=st.location;if(st.weather)w.clock.weather=st.weather;
 for(const k of ['mood','inner','doing'])if(st[k])w.status[k]=st[k];
 if(Array.isArray(st.npcs)&&st.npcs.length)w.status.npcs=st.npcs.filter(n=>n&&n.name).map(n=>({name:n.name,where:n.where||'',doing:n.doing||''}));
 if(Array.isArray(st.relations))for(const r of st.relations){if(!r?.a||!r?.b||!r?.label)continue;let e=w.relations.find(x=>(x.a===r.a&&x.b===r.b)||(x.a===r.b&&x.b===r.a));
  if(!e){e={a:r.a,b:r.b,label:r.label,history:[]};w.relations.push(e);}if(e.label!==r.label||r.note){e.history.push({no,label:r.label,note:r.note||''});e.label=r.label;}}
 if(st.memory&&String(st.memory).trim())w.memoryPoints.push({no,text:String(st.memory).trim()});}
function setBusy(b){gen.busy=b;$('#btn-send').disabled=b;$('#btn-inspire').disabled=b;$('#btn-stop').hidden=!b;}
async function sendFloor(){
 if(gen.busy)return;const w=W(),c=C(w);const text=$('#input').value.trim();
 if(AI.mode==='none'){toast(errCopy({code:'not_connected'}),5000);if(text){addFloor(w,'user',text);$('#input').value='';renderStory();}return;}
 const {msgs}=buildPrompt(text);
 if(text){addFloor(w,'user',text);$('#input').value='';}
 const fl=addFloor(w,'char','');fl.streaming=true;renderStory();const el=$(`.floor[data-id="${fl.id}"]`);el.classList.add('streaming');$('.body',el).innerHTML='<span class="think"><i></i>正在思考…</span>';$('#floors').scrollTop=$('#floors').scrollHeight;
 await runGeneration(msgs,fl,w,el);
}
async function runGeneration(msgs,fl,w,el){
 setBusy(true);gen.ctl=new AbortController();let full='';
 try{const r=await AI.chat(msgs,{signal:gen.ctl.signal,onText:({text})=>{full=text;const {body}=splitState(text);$('.body',el).innerHTML=paras(body);}});full=r.text;
  const {body,state}=splitState(full);fl.alts[fl.alt]=body;fl.worldTime=state?.time||w.clock.time;applyState(w,state,fl.no);memAdd(w,fl);
 }catch(e){const {body}=splitState(e.text||full||'');if(body){fl.alts[fl.alt]=body;fl.worldTime=w.clock.time;memAdd(w,fl);}else{w.floors=w.floors.filter(x=>x!==fl);}if(e.code!=='cancelled')toast(errCopy(e),5000);}
 delete fl.streaming;setBusy(false);save();renderStory();
}
function addFloor(w,role,text){const fl={id:uid(),no:nextNo(w),branchId:w.activeBranchId,role,alts:[text],alt:0,hidden:false,ts:now(),worldTime:w.clock.time};w.floors.push(fl);if(role==='user'&&text)memAdd(w,fl);return fl;}
async function regenFloor(f){
 if(gen.busy)return;const w=W();if(AI.mode==='none')return toast(errCopy({code:'not_connected'}),5000);
 const {msgs}=buildPrompt('',{upTo:f.no-1,lastOverride:`（请重写第 ${f.no} 楼：保持上下文一致，但给出一个明显不同的走向或写法。）`});
 f.alts.push('');f.alt=f.alts.length-1;renderStory();const el=$(`.floor[data-id="${f.id}"]`);el.classList.add('streaming');$('.body',el).innerHTML='<span class="think"><i></i>正在重写…</span>';
 MEM.docs.delete(w.id+'|'+f.id);await runGeneration(msgs,f,w,el);
}
async function inspire(){
 if(gen.busy)return;if(AI.mode==='none')return toast(errCopy({code:'not_connected'}),5000);
 const {msgs}=buildPrompt($('#input').value,{inspire:true});const ta=$('#input');const old=ta.value;setBusy(true);gen.ctl=new AbortController();ta.placeholder='✦ 正在替你起草…';
 try{const r=await AI.chat(msgs,{signal:gen.ctl.signal,onText:({text})=>{ta.value=text;}});ta.value=r.text.trim();toast('灵感已放进输入框，随意改');}catch(e){if(e.code!=='cancelled'){ta.value=old;toast(errCopy(e),5000);}}
 ta.placeholder='写下 uu 的动作与台词……（留空发送 = 让剧情继续）';setBusy(false);renderMeter();
}

async function timeSkip(days,note){

 const base=buildPrompt('').segs.filter(([n])=>!n.startsWith('回复规则')&&!n.startsWith('预设 · 状态回传')).map(([n,t])=>`## ${n}\n${t}`).join('\n\n');
 const recent=visibleFloors(w).filter(f=>!f.hidden&&f.role!=='system').slice(-6).map(f=>`〔第${f.no}楼〕${floorText(f).slice(0,400)}`).join('\n');
 const chats=w.phone.chats.map(ch=>`${ch.name}（${ch.type==='group'?'群聊':'私聊'}）`).join('、');
 const prompt=`${base}\n\n## 最近的剧情\n${recent}\n\n## 任务\n现在世界时间从「${w.clock.time}」向后推进 ${days} 天。${note?`这段时间里 ${S.user.name}：${note}`:''}\n请模拟这 ${days} 天里 ${c.name} 与每位 NPC 各自的生活（工作、社交、心情起伏、彼此之间可能的互动），要有具体事件，不要都围着 ${S.user.name} 转。然后以 JSON 输出，只输出 JSON：\n{"time":"推进后的世界时间（同格式）","location":"${c.name} 现在在哪","weather":"天气","days":[{"date":"这一天的日期（接着世界时间往后推）","events":["这一天发生的事，1-3 条，每条一句话"]}],"whatsapp":[{"chat":"聊天名（只能是：${chats}）","messages":[{"from":"发送者","text":"消息内容"}]}],"ig":[{"author":"发帖人","caption":"文案","scene":"配图画面描述（一句话）"}],"diary":{"date":"日期","mood":"心情","text":"${c.name} 这几天里写的一篇日记，第一人称，150-300 字"},"status":{"mood":"${c.name} 现在的情绪","inner":"此刻心声","doing":"正在做什么","npcs":[{"name":"NPC","where":"在哪","doing":"做什么"}]},"relations":[{"a":"A","b":"B","label":"新的关系","note":"变化原因"}],"memory":["值得记住的事，1-3 条"]}\n消息要符合每个人的说话习惯，${c.name} 发消息应该简短克制；NPC 的私聊里可以有 ${S.user.name} 不在场时发生的事的线索。`;
 try{const j=await AI.chat([{role:'user',content:prompt}],{json:true});
  const no=nextNo(w);const daysTxt=Array.isArray(j.days)&&j.days.length?j.days.map(d=>`${d.date||''}\n`+(d.events||[]).map(e=>'  · '+e).join('\n')).join('\n'):(j.events||[]).map(e=>'· '+e).join('\n');const sys=addFloor(w,'system',`⏭ 时间推进 ${days} 天（${w.clock.time} → ${j.time||'?'}）\n`+daysTxt);
  applyState(w,{time:j.time,location:j.location,weather:j.weather,...(j.status||{}),relations:j.relations},no);
  for(const m of j.memory||[])w.memoryPoints.push({no,text:String(m)});
  for(const cw of j.whatsapp||[]){const ch=w.phone.chats.find(x=>x.name===cw.chat)||w.phone.chats.find(x=>cw.chat?.includes(x.name));if(!ch)continue;for(const m of cw.messages||[]){if(!m?.text)continue;ch.messages.push({from:m.from||ch.name,text:m.text,time:j.time||'',unread:m.from!==S.user.name});}}
  for(const p of j.ig||[]){if(!p?.caption)continue;w.phone.ig.unshift({id:uid(),author:p.author||c.name,time:j.time||'',caption:p.caption,scene:p.scene||'',bg:randomBg(),likes:Math.floor(Math.random()*80)+3,unread:true});}
  if(j.diary?.text)w.diary.push({date:j.diary.date||j.time||'',mood:j.diary.mood||'',text:j.diary.text,unread:true});
  memoryBook(w);memIndexAll();save();renderStory();toast('世界往前走了。打开小手机看看有没有新消息。',5000);
 }catch(e){toast(errCopy(e),6000);}
 setBusy(false);
}

function personaOf(w,name){const c=C(w);if(name===c.name)return {name,desc:`${c.card.description}\n性格：${c.card.personality}`,isChar:true};const n=(c.npcs||[]).find(x=>x.name===name);if(n)return {name,desc:`${n.gender||''} ${n.age||''}岁，${n.look||''}。性格：${n.personality||''}。与 ${c.name}：${n.relChar||''}；与 ${S.user.name}：${n.relUser||''}`,isChar:false};return {name,desc:'（未登记的人物）',isChar:false};}
function knowledgeFor(w,name){const c=C(w);const parts=[];
 if(name===c.name){parts.push('最近剧情（你亲历）：\n'+visibleFloors(w).filter(f=>!f.hidden&&f.role!=='system').slice(-5).map(f=>`〔第${f.no}楼〕${floorText(f).slice(0,300)}`).join('\n'));}
 const mem=memoryBook(w).entries.filter(e=>e.enabled).map(e=>e.content.slice(0,400));if(mem.length)parts.push('长期记忆：\n'+mem.join('\n'));
 for(const ch of w.phone.chats){if(ch.type==='group'&&(ch.members||[]).includes(name))parts.push(`群聊「${ch.name}」：\n`+ch.messages.slice(-12).map(m=>`${m.from}：${m.text}`).join('\n'));}

async function waReply(ch,poke=false){

  for(const m of (Array.isArray(arr)?arr:[arr])){if(!m?.text)continue;const from=speakers.includes(m.from)?m.from:speakers[0];ch.messages.push({from,text:String(m.text),time:w.clock.time,unread:false});}

function renderForumInto(box){const w=W();const boards=w.forum.boards;if(forumBoard>=boards.length)forumBoard=0;const b=boards[forumBoard];
 if(forumThread){const t=b.threads.find(x=>x.id===forumThread);if(t){box.innerHTML=`<div style="padding:8px 14px"><button class="small ghost" id="fo-back">‹ 返回 ${esc(b.name)}</button><h3 style="margin:10px 0 2px">${esc(t.title)}</h3><div class="t-meta">${esc(t.author)} · ${esc(t.time||'')}</div>${t.posts.map(p=>`<div class="t-post"><div class="who">${esc(p.who)}</div>${esc(p.text)}</div>`).join('')}<div class="chat-input" style="padding:10px 0"><input type="text" id="fo-in" placeholder="以 ${esc(S.user.name)} 的身份回帖…"><button class="primary small" id="fo-send">回帖</button></div></div>`;
  $('#fo-back').onclick=()=>{forumThread=null;renderForumInto(box);};$('#fo-send').onclick=async()=>{const v=$('#fo-in').value.trim();if(!v)return;t.posts.push({who:S.user.name,text:v});save();renderForumInto(box);
   if(AI.mode==='none')return;try{const arr=await AI.chat([{role:'user',content:`论坛帖子《${t.title}》，板块「${b.name}」，世界背景：${C(w).card.scenario}。楼层：\n${t.posts.map(p=>p.who+'：'+p.text).join('\n')}\n请生成 1-2 条新的网友回帖（可以是路人，也可以是这些人物之一：${(C(w).npcs||[]).map(n=>n.name).join('、')}，但不要是 ${S.user.name}）。只输出 JSON 数组：[{"who":"网名","text":"回帖"}]`}],{json:true,tier:'quick'});for(const p of arr||[])if(p?.text)t.posts.push({who:p.who||'匿名',text:p.text});save();renderForumInto(box);}catch(e){toast(errCopy(e),4000);}};return;}}
 box.innerHTML=`<div style="padding:8px 14px"><div class="board-tabs">${boards.map((x,i)=>`<button class="small ${i===forumBoard?'active':''}" data-b="${i}">${esc(x.name)}</button>`).join('')}<button class="small ghost" id="fo-addb">＋板块</button><span class="grow"></span><button class="small" id="fo-refresh">↻ 生成新帖</button></div>${b.threads.map(t=>`<div class="thread" data-t="${t.id}"><div class="t-title">${esc(t.title)}</div><div class="t-meta">${esc(t.author)} · ${esc(t.time||'')} · ${t.posts.length} 楼</div></div>`).join('')||'<div class="muted">这个板块还没有帖子</div>'}</div>`;
 $$('[data-b]',box).forEach(x=>x.onclick=()=>{forumBoard=+x.dataset.b;renderForumInto(box);});$$('[data-t]',box).forEach(x=>x.onclick=()=>{forumThread=x.dataset.t;renderForumInto(box);});
 $('#fo-addb',box).onclick=()=>promptBox('板块名','',v=>{if(v){boards.push({name:v,threads:[]});forumBoard=boards.length-1;save();renderForumInto(box);}});
 $('#fo-refresh',box).onclick=async()=>{if(AI.mode==='none')return toast(errCopy({code:'not_connected'}),4000);toast('正在生成新帖…');const c=C(w);
  try{const arr=await AI.chat([{role:'user',content:`世界背景：${c.card.scenario}；${(S.lorebooks.filter(l=>l.kind!=='memory'&&(!l.worldId||l.worldId===w.id)).flatMap(l=>l.entries).filter(e=>e.constant).map(e=>e.content).join('；'))}\n世界时间：${w.clock.time}。最近发生的事：${(w.memoryPoints||[]).slice(-6).map(m=>m.text).join('；')}\n请为论坛板块「${b.name}」生成 2 个新帖子，网友视角，可以隐约提到剧情人物但不要直呼其名（除非是公众人物），每帖 2-4 楼。可以让这些人物之一用网名或本名回帖：${(c.npcs||[]).map(n=>n.name).join('、')}。只输出 JSON 数组：[{"title":"标题","author":"楼主网名","posts":[{"who":"网名","text":"内容"}]}]`}],{json:true,tier:'quick'});
   for(const t of arr||[]){if(!t?.title)continue;b.threads.unshift({id:uid(),title:t.title,author:t.author||'匿名',time:w.clock.time,posts:(t.posts||[]).filter(p=>p?.text).map(p=>({who:p.who||'匿名',text:p.text}))});}save();renderForumInto(box);}catch(e){toast(errCopy(e),5000);}};

let selEdge=null;
function renderRecords(){const w=W();const el=$('#records-page');const names=[...new Set([S.user.name,C(w).name,...w.relations.flatMap(r=>[r.a,r.b])])];
 const W0=760,H0=420,cx=W0/2,cy=H0/2,rx=300,ry=160;const pos={};names.forEach((n,i)=>{const a=-Math.PI/2+i*2*Math.PI/names.length;pos[n]=[cx+rx*Math.cos(a),cy+ry*Math.sin(a)];});
 const edges=w.relations.map((r,i)=>{const [x1,y1]=pos[r.a],[x2,y2]=pos[r.b];return `<line class="edge ${selEdge===i?'sel':''}" data-e="${i}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"></line><text class="elabel" x="${(x1+x2)/2}" y="${(y1+y2)/2-6}" text-anchor="middle">${esc(r.label)}</text>`;}).join('');
 const nodes=names.map(n=>{const [x,y]=pos[n];return `<g class="node ${n===S.user.name?'user':''}"><circle cx="${x}" cy="${y}" r="26"></circle><text x="${x}" y="${y+5}" text-anchor="middle">${esc(n)}</text></g>`;}).join('');
 const r=selEdge!=null?w.relations[selEdge]:null;
 el.innerHTML=`<div class="page-head"><div><h2>记录面板</h2><p>人物关系与记忆点。点一条线，看这段关系的变化史。</p></div><button class="small" id="rec-add">＋ 手动添加关系</button></div>
 <div class="card" style="overflow-x:auto"><svg class="graph" viewBox="0 0 ${W0} ${H0}" style="min-width:560px">${edges}${nodes}</svg></div>
 ${r?`<div class="card"><div class="row"><h3 style="margin:0">${esc(r.a)} ↔ ${esc(r.b)}</h3><span class="pill accent">${esc(r.label)}</span><span class="grow"></span><button class="small" id="rec-edit">✎ 修改</button><button class="small danger" id="rec-del">删除</button></div><div class="hist" style="margin-top:12px">${r.history.map(h=>`<div><span class="muted num">第 ${h.no} 楼</span> · <b>${esc(h.label)}</b> ${esc(h.note||'')}</div>`).join('')||'<div class="muted">还没有变化记录</div>'}</div></div>`:''}
 <div class="card"><h3>记忆点</h3>${[...w.memoryPoints].reverse().map((m,i)=>`<div class="mp"><span class="no">第 ${m.no} 楼</span><span class="grow">${esc(m.text)}</span><button class="small ghost" data-mdel="${w.memoryPoints.length-1-i}">✕</button></div>`).join('')||'<p class="muted">还没有记忆点。剧情推进时 AI 会自动记录，你也可以手动添加。</p>'}<div class="row" style="margin-top:12px"><input type="text" id="mp-in" placeholder="手动记一条…" class="grow"><button class="small" id="mp-add">添加</button></div></div>`;
 $$('.edge',el).forEach(e=>e.onclick=()=>{selEdge=+e.dataset.e;renderRecords();});
 $('#mp-add').onclick=()=>{const v=$('#mp-in').value.trim();if(!v)return;w.memoryPoints.push({no:nextNo(w)-1,text:v});save();renderRecords();};
 $$('[data-mdel]',el).forEach(b=>b.onclick=()=>{w.memoryPoints.splice(+b.dataset.mdel,1);save();renderRecords();});
 $('#rec-add').onclick=()=>relModal(w,null);if(r){$('#rec-edit').onclick=()=>relModal(w,r);$('#rec-del').onclick=()=>confirmBox('删除这段关系？',()=>{w.relations.splice(selEdge,1);selEdge=null;save();renderRecords();});}
}
function relModal(w,r){modal({title:r?'修改关系':'添加关系',body:`<div class="grid2"><label class="field"><span>人物 A</span><input type="text" id="r-a" value="${esc(r?.a||S.user.name)}"></label><label class="field"><span>人物 B</span><input type="text" id="r-b" value="${esc(r?.b||'')}"></label></div><label class="field"><span>关系（≤6 字）</span><input type="text" id="r-l" value="${esc(r?.label||'')}"></label><label class="field"><span>备注 / 变化原因</span><input type="text" id="r-n"></label>`,
 foot:[{label:'取消',onClick:closeModal},{label:'保存',cls:'primary',onClick:()=>{const a=$('#r-a').value.trim(),b=$('#r-b').value.trim(),l=$('#r-l').value.trim(),n=$('#r-n').value.trim();if(!a||!b||!l)return;if(r){r.a=a;r.b=b;r.label=l;r.history.push({no:nextNo(w)-1,label:l,note:n});}else w.relations.push({a,b,label:l,history:[{no:nextNo(w)-1,label:l,note:n}]});save();closeModal();renderRecords();}}]});}

function renderMemory(){const w=W();const el=$('#memory-page');const vis=visibleFloors(w).filter(f=>f.role!=='system');const mb=memoryBook(w);
 const lastTo=mb.entries.reduce((a,e)=>Math.max(a,e.to||0),0);const from=lastTo+1,to=Math.min(vis.length?vis[vis.length-1].no:0,lastTo+20);
 const idxW=[...MEM.docs.values()].filter(d=>d.worldId===w.id&&d.kind==='floor').length;const hidden=vis.filter(f=>f.hidden).length;
 el.innerHTML=`<div class="page-head"><div><h2>记忆</h2><p>总结进世界书是长期记忆；索引检索是永久记忆。隐藏的楼层不进上下文，但仍在索引里。</p></div></div>
 <div class="stat-row" style="margin-bottom:16px"><div class="stat"><b class="num">${idxW}</b><span>本世界已索引楼数</span></div><div class="stat"><b class="num">${MEM.count}</b><span>索引总条目（含所有世界）</span></div><div class="stat"><b class="num">${hidden}</b><span>已隐藏楼层</span></div><div class="stat"><b class="num">${mb.entries.length}</b><span>总结条目</span></div></div>
 <div class="card"><h3>总结并归档</h3><label class="field"><span>总结提示词（可改）</span><textarea id="sum-prompt" style="min-height:120px">${esc(S.settings.summaryPrompt)}</textarea></label>
  <div class="row"><label class="field" style="margin:0"><span>从第</span><input type="number" id="sum-from" value="${from}" style="width:100px"></label><label class="field" style="margin:0"><span>到第</span><input type="number" id="sum-to" value="${to}" style="width:100px"></label><label class="switch" style="margin-top:14px"><input type="checkbox" id="sum-hide" checked> 总结后隐藏这些楼层</label><span class="grow"></span><button class="primary" id="sum-go">总结 → 存为「${from}-${to}」</button></div>
  <p class="muted" style="margin-bottom:0">总结会写进世界书「${esc(mb.name)}」的一个新子区，名字就是楼层范围；默认常驻、随时可编辑。</p></div>
 <div class="card"><h3>已归档的总结</h3>${mb.entries.map(e=>`<div class="sum-entry"><div class="r-meta"><span class="pill accent num">${esc(e.title)} 楼</span><label class="switch"><input type="checkbox" data-sen="${e.id}" ${e.enabled?'checked':''}> 进入上下文</label><span class="grow"></span><button class="small ghost" data-sedit="${e.id}">✎</button><button class="small ghost" data-sdel="${e.id}">✕</button></div><pre>${esc(e.content)}</pre></div>`).join('')||'<p class="muted">还没有总结。</p>'}</div>
 <div class="card"><h3>记忆检索</h3><div class="row"><input type="text" id="mem-q" placeholder="搜一句话、一个名字、一件物品…" class="grow"><button class="primary" id="mem-go">检索</button></div><p class="muted">每次最多返回 10 楼。发送剧情时，系统也会自动用你的输入做一次检索，把命中的旧楼塞进提示词。</p><div id="mem-res"></div></div>`;
 $('#sum-prompt').onchange=e=>{S.settings.summaryPrompt=e.target.value;save();};
 $('#sum-go').onclick=()=>summarize(+$('#sum-from').value,+$('#sum-to').value,$('#sum-hide').checked);
 $$('[data-sen]',el).forEach(i=>i.onchange=()=>{mb.entries.find(e=>e.id===i.dataset.sen).enabled=i.checked;save();});
 $$('[data-sdel]',el).forEach(b=>b.onclick=()=>confirmBox('删除这条总结？',()=>{mb.entries=mb.entries.filter(e=>e.id!==b.dataset.sdel);memIndexAll();save();renderMemory();}));
 $$('[data-sedit]',el).forEach(b=>b.onclick=()=>{const e=mb.entries.find(x=>x.id===b.dataset.sedit);modal({title:'编辑总结 '+e.title,body:`<textarea id="se-t" style="min-height:260px">${esc(e.content)}</textarea>`,foot:[{label:'取消',onClick:closeModal},{label:'保存',cls:'primary',onClick:()=>{e.content=$('#se-t').value;memIndexAll();save();closeModal();renderMemory();}}]});});
 const go=async()=>{const q=$('#mem-q').value.trim();let res,src='本页索引';
  if(AI.backendOk&&q.length>=3){try{const r=await fetch(S.settings.backendUrl.replace(/\/$/,'')+'/api/memory/search?world='+encodeURIComponent(w.id)+'&q='+encodeURIComponent(q)+'&limit=10');res=(await r.json()).results.map(x=>({...x,text:x.snippet.replace(/\[|\]/g,''),score:-x.score}));src='SQLite FTS5';}catch(e){}}
  if(!res)res=memSearch(q,{worldId:w.id,limit:10});
  $('#mem-res').innerHTML=(q?`<div class="muted" style="font-size:.85em;margin:8px 0">来源：${src}</div>`:'')+res.map(r=>`<div class="result"><div class="r-meta"><span class="num">${r.kind==='summary'?'总结':'第 '+r.no+' 楼'}</span><span>${esc(r.who)}</span><span class="faint num">相关度 ${(+r.score).toFixed(1)}</span></div>${snippet(r.text,q,160)}</div>`).join('')||(q?'<p class="muted">没有找到。</p>':'');};
 $('#mem-go').onclick=go;$('#mem-q').onkeydown=e=>{if(e.key==='Enter')go();};
}
async function summarize(from,to,hide){
 if(AI.mode==='none')return toast(errCopy({code:'not_connected'}),5000);const w=W();const fls=visibleFloors(w).filter(f=>f.role!=='system'&&f.no>=from&&f.no<=to);if(!fls.length)return toast('这个范围里没有楼层');
 toast(`正在总结第 ${from}-${to} 楼…`,8000);const c=C(w);
 const p=`${S.settings.summaryPrompt}\n\n另外：第一行请单独写“章名：xxx”（4-10 字，像小说章节名），然后空一行再写总结。\n\n人物：${c.name}（主角），${S.user.name}（用户），NPC：${(c.npcs||[]).map(n=>n.name).join('、')}\n\n${fls.map(f=>`〔第${f.no}楼 · ${f.role==='user'?S.user.name:c.name}〕\n${floorText(f)}`).join('\n\n')}`;
 try{const r=await AI.chat([{role:'user',content:p}],{});let text=r.text.trim(),chapter='';const m=text.match(/^章名[：:]\s*(.+)\s*\n?/);if(m){chapter=m[1].trim();text=text.slice(m[0].length).trim();}const mb=memoryBook(w);const idx=mb.entries.filter(e=>e.from).length+1;mb.entries.push({id:uid(),title:`${from}-${to}`,from,to,keys:'',constant:true,enabled:true,content:text,chapter:chapter?`第 ${idx} 章 · ${chapter}`:''});
  if(hide)fls.forEach(f=>f.hidden=true);memIndexAll();save();renderMemory();toast('已归档到世界书「'+mb.name+'」');}catch(e){toast(errCopy(e),6000);}
}

async function importCard(file){try{let data;if(file.name.endsWith('.json'))data=JSON.parse(await file.text());else data=readPngCard(new Uint8Array(await file.arrayBuffer()));
 const d=data.data||data;const nc={id:uid(),name:d.name||'导入角色',avatar:(d.name||'角')[0],color:'#6B4E3D',card:{description:d.description||'',personality:d.personality||'',scenario:d.scenario||'',first:d.first_mes||'',example:d.mes_example||''},npcs:[]};
 if(S.chars.length>=5)return toast('已有 5 个角色，先删一个');S.chars.push(nc);selChar=nc.id;
 if(d.character_book?.entries?.length){S.lorebooks.push({id:uid(),name:nc.name+' · 角色书',worldId:null,kind:'normal',entries:d.character_book.entries.map(e=>({id:uid(),title:e.comment||e.name||(e.keys||[]).join(',')||'条目',keys:(e.keys||[]).join(','),content:e.content||'',constant:!!e.constant,enabled:e.enabled!==false}))});}
 save();renderChars();toast('已导入 '+nc.name+(d.character_book?'（含角色书）':''));}catch(e){toast('导入失败：'+e.message,5000);}}
function readPngCard(u8){if(u8[0]!==0x89||u8[1]!==0x50)throw new Error('不是 PNG 文件');let p=8;const dv=new DataView(u8.buffer);const td=new TextDecoder();
 while(p<u8.length){const len=dv.getUint32(p);const type=td.decode(u8.slice(p+4,p+8));if(type==='tEXt'){const body=u8.slice(p+8,p+8+len);const z=body.indexOf(0);const key=td.decode(body.slice(0,z));if(key==='chara'||key==='ccv3'){const b64=td.decode(body.slice(z+1));const bin=atob(b64);const bytes=Uint8Array.from(bin,ch=>ch.charCodeAt(0));return JSON.parse(new TextDecoder().decode(bytes));}}p+=12+len;}
 throw new Error('PNG 里没有角色卡数据（chara 块）');}

const cloud={db:null,status:'未连接（只在 claude.ai 里可用）',saving:false};
async function cloudInit(){try{if(!window.claude?.use)return;cloud.db=await window.claude.use('db');if(!cloud.db){cloud.status='此环境不支持云同步';return;}
 const m=await cloud.db.doc('airp/manifest').get();if(m.exists){const d=m.data();if(d.savedAt&&d.savedAt>(S.savedAt||0)){const parts=[];for(let i=0;i<d.chunks;i++){const c=await cloud.db.doc('airp/chunk_'+i).get();parts.push(c.data()?.t||'');}const j=JSON.parse(parts.join(''));if(j.worlds){S=j;memIndexAll();applySettings();showView(S.settings.lastView||'story');cloud.status='已从云端载入较新的存档（'+new Date(d.savedAt).toLocaleString()+'）';toast('已同步云端存档');renderSettings();return;}}}
 cloud.status='已连接';renderSettings();}catch(e){cloud.status='云同步出错：'+(e.message||e.code);}}
async function cloudSave(){if(!cloud.db||!S.settings.cloudSync||cloud.saving)return;cloud.saving=true;try{S.savedAt=now();const s=JSON.stringify(S);const CH=180000;const n=Math.ceil(s.length/CH);for(let i=0;i<n;i++)await cloud.db.doc('airp/chunk_'+i).set({t:s.slice(i*CH,(i+1)*CH)});await cloud.db.doc('airp/manifest').set({savedAt:S.savedAt,chunks:n});cloud.status='已同步 · '+new Date(S.savedAt).toLocaleTimeString();const el=$('#s-cloud-st');if(el)el.textContent=cloud.status;}catch(e){cloud.status='同步失败：'+(e.message||e.code);}cloud.saving=false;}

/* =====================================================================
   启动
   ===================================================================== */
Object.assign(RENDER,{story:renderStory,phone:renderPhone,forum:renderForum,diary:renderDiary,records:renderRecords,memory:renderMemory,chars:renderChars,presets:renderPresets,lore:renderLore,settings:renderSettings});
buildNav();applySettings();memIndexAll();renderModelSelect();showView(S.settings.lastView||'story');
AI.init().then(()=>{if(view==='story')renderMeter();if(AI.mode==='none')toast('演示模式：没有 AI 连接。在 claude.ai 里打开可直接用订阅额度。',6000);});
cloudInit();
window.addEventListener('beforeunload',()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}});
</script>
